<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent node SVG icons</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f7f7f7;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #333333;
      }

      .sheet {
        display: grid;
        grid-template-columns: repeat(5, 96px);
        gap: 24px;
        padding: 40px;
        background: #ffffff;
        border: 1px solid #e6e6e6;
      }

      .item {
        display: grid;
        justify-items: center;
        gap: 14px;
        font-size: 12px;
        letter-spacing: 0.3px;
      }

      .icon-box {
        width: 56px;
        height: 56px;
        display: grid;
        place-items: center;
        background: #fafafa;
        border: 1px solid #e6e6e6;
      }

      img {
        width: 24px;
        height: 24px;
      }
    </style>
  </head>
  <body>
    <main class="sheet">
      <section class="item"><div class="icon-box"><img src="./start.svg" alt="start" /></div><span>start</span></section>
      <section class="item"><div class="icon-box"><img src="./if-else.svg" alt="if-else" /></div><span>if-else</span></section>
      <section class="item"><div class="icon-box"><img src="./code.svg" alt="code" /></div><span>code</span></section>
      <section class="item"><div class="icon-box"><img src="./llm.svg" alt="llm" /></div><span>llm</span></section>
      <section class="item"><div class="icon-box"><img src="./answer.svg" alt="answer" /></div><span>answer</span></section>
    </main>
  </body>
</html>
