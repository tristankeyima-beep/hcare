<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>档案页-干预方案Tab</title>
  <style>
    :root {
      --blue: #1787e8;
      --text: #333333;
      --muted: #666666;
      --weak: #999999;
      --line: #e9e9e9;
      --bg: #f3f3f3;
      --panel: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: #f5f5f5;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 22px 12px;
      font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif;
      color: var(--text);
      background: #f5f5f5;
    }

    a {
      color: inherit;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    .phone {
      position: relative;
      width: 375px;
      min-height: 812px;
      overflow: hidden;
      background: var(--bg);
      box-shadow: 0 18px 46px rgba(0, 0, 0, 0.12);
    }

    .status-bar {
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 24px 0;
      background: #fff;
      color: #000;
      font-size: 16px;
      font-weight: 700;
      line-height: 1;
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .signal {
      width: 18px;
      height: 13px;
      background:
        linear-gradient(to top, #000 100%, #000 100%) left 0 bottom 0 / 3px 5px no-repeat,
        linear-gradient(to top, #000 100%, #000 100%) left 5px bottom 0 / 3px 8px no-repeat,
        linear-gradient(to top, #000 100%, #000 100%) left 10px bottom 0 / 3px 11px no-repeat,
        linear-gradient(to top, #000 100%, #000 100%) left 15px bottom 0 / 3px 13px no-repeat;
    }

    .wifi {
      position: relative;
      width: 18px;
      height: 14px;
      border: 3px solid #000;
      border-color: #000 transparent transparent transparent;
      border-radius: 50%;
    }

    .wifi::after {
      content: "";
      position: absolute;
      left: 5px;
      top: -1px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #000;
    }

    .battery {
      position: relative;
      width: 25px;
      height: 13px;
      border: 2px solid #000;
      border-radius: 3px;
    }

    .battery::before {
      content: "";
      position: absolute;
      inset: 2px 4px 2px 2px;
      background: #000;
      border-radius: 1px;
    }

    .battery::after {
      content: "";
      position: absolute;
      right: -5px;
      top: 3px;
      width: 3px;
      height: 7px;
      background: #000;
      border-radius: 0 2px 2px 0;
    }

    .top-nav {
      height: 88px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px 0 28px;
      background: #fff;
    }

    .nav-tabs {
      display: flex;
      align-items: center;
      gap: 27px;
      font-size: 15px;
      font-weight: 700;
    }

    .nav-tabs span {
      color: #252525;
    }

    .nav-tabs .active {
      color: var(--blue);
    }

    .wechat-menu {
      width: 88px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: space-evenly;
      border-radius: 999px;
      background: #fff;
      border: 1px solid #e7e7e7;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
    }

    .menu-dots {
      display: flex;
      gap: 4px;
    }

    .menu-dots i {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #000;
    }

    .menu-line {
      width: 1px;
      height: 18px;
      background: #d6d6d6;
    }

    .menu-circle {
      width: 23px;
      height: 23px;
      border: 4px solid #000;
      border-radius: 50%;
      position: relative;
    }

    .menu-circle::after {
      content: "";
      position: absolute;
      inset: 5px;
      border-radius: 50%;
      background: #000;
    }

    .profile-area {
      position: relative;
      height: 292px;
      background: #f1f1f1;
      overflow: hidden;
    }

    .person {
      position: absolute;
      left: 50%;
      bottom: -26px;
      width: 204px;
      transform: translateX(-50%);
      z-index: 2;
    }

    .quick-item {
      position: absolute;
      z-index: 3;
      width: 132px;
    }

    .quick-item.left {
      left: 21px;
    }

    .quick-item.right {
      right: 20px;
    }

    .quick-item.top {
      top: 58px;
    }

    .quick-item.bottom {
      top: 158px;
    }

    .quick-title {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #585858;
      font-size: 15px;
      font-weight: 800;
      line-height: 1.2;
      white-space: nowrap;
    }

    .quick-title::before {
      content: "";
      width: 2px;
      height: 15px;
      background: var(--blue);
    }

    .quick-action {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
      color: #333;
      font-size: 14px;
      font-weight: 500;
      line-height: 1;
      white-space: nowrap;
    }

    .dash {
      width: 56px;
      height: 1px;
      background: repeating-linear-gradient(90deg, var(--blue) 0 8px, transparent 8px 16px);
    }

    .quick-item.right .quick-action {
      justify-content: flex-end;
      flex-direction: row-reverse;
    }

    .slider {
      position: absolute;
      left: 50%;
      bottom: 72px;
      z-index: 4;
      display: flex;
      align-items: center;
      gap: 7px;
      transform: translateX(-50%);
    }

    .slider i {
      width: 18px;
      height: 7px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.7);
    }

    .slider i.active {
      width: 27px;
      background: var(--blue);
    }

    .content-panel {
      position: relative;
      z-index: 5;
      margin-top: -1px;
      min-height: 388px;
      padding: 20px 10px 28px;
      background: #fff;
      border-radius: 22px 22px 0 0;
    }

    .sub-tabs {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      margin-bottom: 20px;
    }

    .sub-tab {
      min-width: 86px;
      height: 31px;
      display: grid;
      place-items: center;
      color: #333;
      background: #fff;
      font-size: 14px;
      font-weight: 500;
      line-height: 1;
    }

    .sub-tab.active {
      border: 1px solid #7a7a7a;
      font-weight: 600;
    }

    .timeline {
      position: relative;
      padding-left: 28px;
    }

    .timeline::before {
      content: "";
      position: absolute;
      left: 11px;
      top: 11px;
      bottom: 62px;
      width: 1px;
      background: #8a8a8a;
    }

    .timeline-item {
      position: relative;
      margin-bottom: 25px;
    }

    .timeline-node {
      position: absolute;
      left: -28px;
      top: 1px;
      width: 20px;
      height: 20px;
      border: 1px solid #888;
      background:
        linear-gradient(45deg, transparent 48%, #888 49%, #888 51%, transparent 52%),
        linear-gradient(-45deg, transparent 48%, #888 49%, #888 51%, transparent 52%),
        #fff;
    }

    .date {
      margin: 0 0 12px;
      font-size: 15px;
      font-weight: 500;
      line-height: 1.2;
      color: #333;
    }

    .plan-card {
      position: relative;
      display: block;
      margin-right: 0;
      padding: 13px 38px 15px 13px;
      border: 1px solid #ececec;
      border-radius: 5px;
      background: #fff;
    }

    .plan-tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 22px;
      padding: 0 9px;
      border: 1px solid #777;
      border-radius: 9px;
      color: #333;
      font-size: 14px;
      font-weight: 500;
      line-height: 1;
    }

    .plan-info {
      margin-top: 14px;
      color: #333;
      font-size: 14px;
      line-height: 1.43;
      font-weight: 500;
    }

    .plan-info p {
      margin: 0;
    }

    .arrow {
      position: absolute;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: #333;
      font-size: 23px;
      line-height: 1;
      font-weight: 400;
    }

    .end-text {
      margin: 6px 0 0;
      text-align: center;
      color: #333;
      font-size: 14px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <main class="phone" aria-label="档案页干预方案">
    <div class="status-bar">
      <span>9:41</span>
      <div class="status-icons" aria-hidden="true">
        <span class="signal"></span>
        <span class="wifi"></span>
        <span class="battery"></span>
      </div>
    </div>

    <header class="top-nav">
      <nav class="nav-tabs" aria-label="主导航">
        <span>首页</span>
        <span class="active">档案</span>
        <span>我的</span>
      </nav>
      <div class="wechat-menu" aria-hidden="true">
        <span class="menu-dots"><i></i><i></i><i></i></span>
        <span class="menu-line"></span>
        <span class="menu-circle"></span>
      </div>
    </header>

    <section class="profile-area">
      <img class="person" src="../【产品原型】慢管全量产品原型/images/小程序首页改造v0911/u9987.png" alt="患者健康画像" />

      <a class="quick-item left top" href="#">
        <div class="quick-title">健康画像</div>
        <div class="quick-action">去查看 <span class="dash"></span></div>
      </a>

      <a class="quick-item right top" href="#">
        <div class="quick-title">监测提醒</div>
        <div class="quick-action">去查看 <span class="dash"></span></div>
      </a>

      <a class="quick-item left bottom" href="#">
        <div class="quick-title">智能设备</div>
        <div class="quick-action">去连接 <span class="dash"></span></div>
      </a>

      <a class="quick-item right bottom" href="#">
        <div class="quick-title">随访记录</div>
        <div class="quick-action">去查看 <span class="dash"></span></div>
      </a>

      <div class="slider" aria-hidden="true">
        <i class="active"></i>
        <i></i>
        <i></i>
        <i></i>
      </div>
    </section>

    <section class="content-panel">
      <nav class="sub-tabs" aria-label="档案二级导航">
        <a class="sub-tab" href="#">健康指标</a>
        <a class="sub-tab" href="#">饮食运动</a>
        <a class="sub-tab active" href="#">干预方案</a>
      </nav>

      <div class="timeline">
        <article class="timeline-item">
          <span class="timeline-node" aria-hidden="true"></span>
          <h2 class="date">2026年05月24日</h2>
          <a class="plan-card" href="./干预方案详情.html">
            <span class="plan-tag">饮食方案</span>
            <div class="plan-info">
              <p>方案名称：26年5月饮食方案</p>
              <p>评估人：李时珍</p>
              <p>评估对象：李菊花</p>

            <span class="arrow">&gt;</span>

        </article>

        <article class="timeline-item">
          <span class="timeline-node" aria-hidden="true"></span>
          <h2 class="date">2025年05月23日</h2>
          <a class="plan-card" href="./干预方案详情.html">
            <span class="plan-tag">用药指导</span>
            <div class="plan-info">
              <p>方案名称：24年度用药分析报告</p>
              <p>评估人：李时珍</p>
              <p>评估对象：李菊花</p>
              <p>评估时间：2025-05-24 23:06:15</p>
            </div>
            <span class="arrow">&gt;</span>
          </a>
        </article>
      </div>

      <p class="end-text">没有更多了</p>
    </section>
  </main>
</body>
</html>
