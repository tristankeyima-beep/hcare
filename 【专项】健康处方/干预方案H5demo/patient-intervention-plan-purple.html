<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>健康干预方案</title>
  <style>
    :root {
      --bg: #f7f5ff;
      --text: #1e1b35;
      --muted: #6d6888;
      --purple: #7c3aed;
      --soft: #ede9fe;
      --line: #ddd6fe;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    .page { max-width: 760px; margin: 0 auto; padding: 14px 14px 32px; }
    .header {
      border-radius: 28px;
      padding: 22px 20px;
      background: linear-gradient(135deg, #5b21b6, #8b5cf6);
      color: #fff;
      box-shadow: 0 24px 48px rgba(91, 33, 182, 0.2);
    }

    .label {
      display: inline-flex;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
      font-size: 12px;
      font-weight: 700;
    }

    h1, h2, p { margin: 0; }
    h1 { margin-top: 14px; font-size: 28px; line-height: 1.25; }
    .intro { margin-top: 12px; font-size: 14px; line-height: 1.8; opacity: 0.95; }

    .nav-row {
      margin-top: 14px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .nav-pill {
      flex-shrink: 0;
      padding: 10px 14px;
      border-radius: 999px;
      background: #fff;
      color: var(--purple);
      border: 1px solid var(--line);
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
    }

    .notice {
      margin-top: 12px;
      border-radius: 22px;
      padding: 16px;
      background: #fff;
      border: 1px solid var(--line);
    }

    .notice h2 {
      font-size: 15px;
      color: var(--purple);
      margin-bottom: 8px;
    }

    .notice p {
      font-size: 14px;
      line-height: 1.8;
      color: var(--muted);
    }

    .chapter {
      margin-top: 16px;
      border-radius: 28px;
      background: #fff;
      border: 1px solid var(--line);
      overflow: hidden;
      box-shadow: 0 14px 30px rgba(15, 23, 42, 0.06);
    }

    .chapter-head {
      padding: 18px 16px;
      background: linear-gradient(90deg, #ede9fe, #ffffff);
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
    }

    .big-no {
      font-size: 36px;
      line-height: 1;
      font-weight: 900;
      color: var(--purple);
    }

    .chapter-head h2 {
      flex: 1;
      font-size: 20px;
      line-height: 1.2;
      padding-bottom: 2px;
    }

    .chapter-body {
      padding: 14px;
      display: grid;
      gap: 12px;
    }

    .row {
      border-radius: 20px;
      background: #faf9ff;
      border: 1px solid #ebe7ff;
      padding: 14px;
    }

    .row-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .check {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 800;
      color: var(--purple);
    }

    .check::before {
      content: "✓";
      width: 22px;
      height: 22px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: var(--soft);
      font-size: 14px;
    }

    .badge {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      background: #f1f5f9;
      color: #64748b;
      white-space: nowrap;
    }

    .high { background: #ffe4e6; color: #be123c; }
    .normal { background: var(--soft); color: var(--purple); }

    .content {
      font-size: 16px;
      line-height: 1.7;
      font-weight: 700;
    }

    .focus {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--line);
      font-size: 14px;
      line-height: 1.8;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="page" id="app"></main>
  <script>
    const planData = {
      plan_name: "健康干预方案",
      plan_title: "个性化健康管理建议",
      plan_summary: "本方案围绕糖尿病合并血压偏高管理，重点从饮食调整、规律运动、阶段控制目标和居家监测四个方面，帮助患者稳定血糖、降低心血管风险，并提升长期自我管理能力。",
      execution_points: "优先落实重点执行条目；饮食和运动建议以循序渐进、可长期坚持为原则；监测数据需按固定时间记录，若连续异常或出现明显不适，应及时联系医生或健管师。",
      groups: [
        { group_title: "饮食干预", items: [
          { content: "每餐主食控制在1拳左右，优先选择燕麦、杂豆、糙米等全谷物，减少白粥、甜点和含糖饮料。", focus_point: "核心目标是降低餐后血糖波动。若近期低血糖风险增加，应先与医生确认主食调整幅度。", importance: "重点执行" },
          { content: "每天至少摄入500g左右非淀粉类蔬菜，烹饪以蒸、煮、炖、少油快炒为主。", focus_point: "注意控制烹调用油和高盐调味品，合并高血压时尤其要减少腌制食品和重口味菜品。", importance: "常规建议" }
        ]},
        { group_title: "运动干预", items: [
          { content: "每周至少5天进行快走、骑行或广场操等中等强度有氧运动，每次30分钟左右。", focus_point: "以微出汗、能说话但不能唱歌为宜；若出现胸闷、头晕、明显心慌，应立即停止运动。", importance: "重点执行" },
          { content: "每周安排2-3次轻阻抗训练，如弹力带、靠墙静蹲、坐姿抬腿，每次10-15分钟。", focus_point: "从低强度开始，优先保证动作安全和规律性，不建议一开始直接追求大重量或长时长。", importance: "补充建议" }
        ]},
        { group_title: "控制目标", items: [
          { content: "空腹血糖建议控制在4.4-7.0 mmol/L，餐后2小时血糖一般建议低于10.0 mmol/L，具体以医生个体化目标为准。", focus_point: "如年龄、合并症、低血糖风险不同，目标范围可能需要放宽或调整，应以临床医生要求为最终依据。", importance: "重点执行" },
          { content: "家庭自测血压建议逐步控制到130/80 mmHg左右；若短期难以达到，先以医生设定的阶段目标推进。", focus_point: "晨起血压偏高时，建议固定在起床后1小时内、服药前、排尿后、安静坐位状态下测量并记录。", importance: "常规建议" }
        ]},
        { group_title: "监测方案", items: [
          { content: "每周至少3天监测空腹血糖和餐后2小时血糖；近期调整饮食、运动或用药后，可阶段性提高监测频次。", focus_point: "建议记录监测时间、数值、当餐饮食、运动和异常感受，便于复诊时判断波动原因。", importance: "重点执行" },
          { content: "每天晨起监测1次血压，连续7天形成记录；若收缩压持续≥160 mmHg或伴随不适，应尽快联系医生。", focus_point: "血压计袖带大小要匹配上臂围，测量前至少安静休息5分钟，避免刚运动、饮咖啡后立刻测量。", importance: "重点执行" }
        ]}
      ]
    };

    const escapeHtml = (value) => String(value ?? "")
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");

    const badgeClass = (importance) => {
      if (importance === "重点执行") return "high";
      if (importance === "常规建议") return "normal";
      return "";
    };

    document.getElementById("app").innerHTML = `
      <section class="header">
        <span class="label">${escapeHtml(planData.plan_name)}</span>
        <h1>${escapeHtml(planData.plan_title)}</h1>
        <p class="intro">${escapeHtml(planData.plan_summary)}</p>
      </section>

      <div class="nav-row">
        ${planData.groups.map((group, idx) => `<a class="nav-pill" href="#chapter-${idx}">${escapeHtml(group.group_title)}</a>`).join("")}
      </div>

      <section class="notice">
        <h2>执行要点</h2>
        <p>${escapeHtml(planData.execution_points)}</p>
      </section>

      ${planData.groups.map((group, groupIndex) => `
        <section class="chapter" id="chapter-${groupIndex}">
          <div class="chapter-head">
            <div class="big-no">0${groupIndex + 1}</div>
            <h2>${escapeHtml(group.group_title)}</h2>
          </div>
          <div class="chapter-body">
            ${group.items.map((item, itemIndex) => `
              <article class="row">
                <div class="row-top">
                  <span class="check">建议 ${itemIndex + 1}</span>
                  <span class="badge ${badgeClass(item.importance)}">${escapeHtml(item.importance)}</span>
                </div>
                <p class="content">${escapeHtml(item.content)}</p>
                <p class="focus">关注点：${escapeHtml(item.focus_point)}</p>
              </article>
            `).join("")}
          </div>
        </section>
      `).join("")}
    `;
  </script>
</body>
</html>
