<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>健康干预方案</title>
  <style>
    :root {
      --bg: #eef8f1;
      --card: #ffffff;
      --text: #173526;
      --muted: #66806f;
      --primary: #16a34a;
      --soft: #dcfce7;
      --line: #c8ead4;
      --shadow: 0 18px 36px rgba(22, 163, 74, 0.12);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: linear-gradient(180deg, #dcfce7 0, #eef8f1 180px, #f8fbf8 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    .page { max-width: 760px; margin: 0 auto; padding: 16px 14px 32px; }
    .hero {
      border-radius: 30px;
      padding: 22px 20px;
      background: linear-gradient(145deg, #15803d, #22c55e);
      color: #fff;
      box-shadow: var(--shadow);
    }

    .eyebrow {
      display: inline-flex;
      padding: 5px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.18);
      font-size: 12px;
      font-weight: 700;
    }

    h1, h2, p { margin: 0; }
    h1 { margin-top: 14px; font-size: 28px; line-height: 1.25; }
    .summary { margin-top: 12px; font-size: 14px; line-height: 1.7; opacity: 0.95; }

    .board {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 14px;
    }

    .mini-card {
      border-radius: 22px;
      padding: 14px;
      background: var(--card);
      border: 1px solid var(--line);
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.05);
    }

    .mini-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
    }

    .mini-value {
      margin-top: 6px;
      font-size: 20px;
      font-weight: 800;
      color: var(--primary);
    }

    .exec {
      margin-top: 12px;
      border-radius: 24px;
      padding: 16px;
      background: #ffffff;
      border: 1px solid var(--line);
    }

    .exec h2 { font-size: 16px; color: var(--primary); }
    .exec p { margin-top: 8px; font-size: 14px; line-height: 1.8; color: #385145; }

    .stack { margin-top: 16px; display: grid; gap: 16px; }
    .group {
      border-radius: 28px;
      padding: 16px;
      background: var(--card);
      border: 1px solid var(--line);
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.06);
    }

    .group-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .group-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 800;
    }

    .leaf {
      width: 36px;
      height: 36px;
      border-radius: 14px;
      background: var(--soft);
      color: var(--primary);
      display: grid;
      place-items: center;
      font-size: 18px;
    }

    .group-count {
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
    }

    .item-row {
      display: grid;
      gap: 12px;
    }

    .item {
      display: grid;
      grid-template-columns: 8px 1fr;
      border-radius: 22px;
      overflow: hidden;
      background: #f7fcf8;
      border: 1px solid #e5f3ea;
    }

    .bar { background: var(--primary); }
    .item-body { padding: 14px 14px 14px 12px; }

    .item-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .item-no { font-size: 12px; font-weight: 800; color: var(--primary); }
    .tag {
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--soft);
      color: var(--primary);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .tag-high { background: #fef2f2; color: #dc2626; }
    .tag-low { background: #f1f5f9; color: #64748b; }
    .content { font-size: 16px; line-height: 1.7; font-weight: 700; }
    .focus {
      margin-top: 10px;
      font-size: 14px;
      line-height: 1.7;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="page" id="app"></main>
  <script>
    const planData = {
      plan_name: "健康干预方案",
      plan_title: "个性化健康管理建议",
      plan_summary: "本方案围绕糖尿病合并血压偏高管理，重点从饮食调整、规律运动、阶段控制目标和居家监测四个方面，帮助患者稳定血糖、降低心血管风险，并提升长期自我管理能力。",
      execution_points: "优先落实重点执行条目；饮食和运动建议以循序渐进、可长期坚持为原则；监测数据需按固定时间记录，若连续异常或出现明显不适，应及时联系医生或健管师。",
      groups: [
        {
          group_title: "饮食干预",
          items: [
            { content: "每餐主食控制在1拳左右，优先选择燕麦、杂豆、糙米等全谷物，减少白粥、甜点和含糖饮料。", focus_point: "核心目标是降低餐后血糖波动。若近期低血糖风险增加，应先与医生确认主食调整幅度。", importance: "重点执行" },
            { content: "每天至少摄入500g左右非淀粉类蔬菜，烹饪以蒸、煮、炖、少油快炒为主。", focus_point: "注意控制烹调用油和高盐调味品，合并高血压时尤其要减少腌制食品和重口味菜品。", importance: "常规建议" }
          ]
        },
        {
          group_title: "运动干预",
          items: [
            { content: "每周至少5天进行快走、骑行或广场操等中等强度有氧运动，每次30分钟左右。", focus_point: "以微出汗、能说话但不能唱歌为宜；若出现胸闷、头晕、明显心慌，应立即停止运动。", importance: "重点执行" },
            { content: "每周安排2-3次轻阻抗训练，如弹力带、靠墙静蹲、坐姿抬腿，每次10-15分钟。", focus_point: "从低强度开始，优先保证动作安全和规律性，不建议一开始直接追求大重量或长时长。", importance: "补充建议" }
          ]
        },
        {
          group_title: "控制目标",
          items: [
            { content: "空腹血糖建议控制在4.4-7.0 mmol/L，餐后2小时血糖一般建议低于10.0 mmol/L，具体以医生个体化目标为准。", focus_point: "如年龄、合并症、低血糖风险不同，目标范围可能需要放宽或调整，应以临床医生要求为最终依据。", importance: "重点执行" },
            { content: "家庭自测血压建议逐步控制到130/80 mmHg左右；若短期难以达到，先以医生设定的阶段目标推进。", focus_point: "晨起血压偏高时，建议固定在起床后1小时内、服药前、排尿后、安静坐位状态下测量并记录。", importance: "常规建议" }
          ]
        },
        {
          group_title: "监测方案",
          items: [
            { content: "每周至少3天监测空腹血糖和餐后2小时血糖；近期调整饮食、运动或用药后，可阶段性提高监测频次。", focus_point: "建议记录监测时间、数值、当餐饮食、运动和异常感受，便于复诊时判断波动原因。", importance: "重点执行" },
            { content: "每天晨起监测1次血压，连续7天形成记录；若收缩压持续≥160 mmHg或伴随不适，应尽快联系医生。", focus_point: "血压计袖带大小要匹配上臂围，测量前至少安静休息5分钟，避免刚运动、饮咖啡后立刻测量。", importance: "重点执行" }
          ]
        }
      ]
    };

    const escapeHtml = (value) => String(value ?? "")
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");

    const tagClass = (importance) => {
      if (importance === "重点执行") return "tag-high";
      if (importance === "补充建议") return "tag-low";
      return "";
    };

    const totalItems = planData.groups.reduce((sum, group) => sum + group.items.length, 0);

    document.getElementById("app").innerHTML = `
      <section class="hero">
        <span class="eyebrow">${escapeHtml(planData.plan_name)}</span>
        <h1>${escapeHtml(planData.plan_title)}</h1>
        <p class="summary">${escapeHtml(planData.plan_summary)}</p>
      </section>

      <section class="board">
        <div class="mini-card"><div class="mini-label">干预模块</div><div class="mini-value">${planData.groups.length} 组</div></div>
        <div class="mini-card"><div class="mini-label">行动条目</div><div class="mini-value">${totalItems} 条</div></div>
      </section>

      <section class="exec">
        <h2>先看执行原则</h2>
        <p>${escapeHtml(planData.execution_points)}</p>
      </section>

      <section class="stack">
        ${planData.groups.map((group, groupIndex) => `
          <article class="group">
            <div class="group-head">
              <div class="group-title"><span class="leaf">${groupIndex + 1}</span>${escapeHtml(group.group_title)}</div>
              <div class="group-count">${group.items.length} 条</div>
            </div>
            <div class="item-row">
              ${group.items.map((item, itemIndex) => `
                <div class="item">
                  <div class="bar"></div>
                  <div class="item-body">
                    <div class="item-top">
                      <span class="item-no">任务 ${itemIndex + 1}</span>
                      <span class="tag ${tagClass(item.importance)}">${escapeHtml(item.importance)}</span>
                    </div>
                    <p class="content">${escapeHtml(item.content)}</p>
                    <p class="focus">关注点：${escapeHtml(item.focus_point)}</p>
                  </div>
                </div>
              `).join("")}
            </div>
          </article>
        `).join("")}
      </section>
    `;
  </script>
</body>
</html>
