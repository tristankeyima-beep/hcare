          import json

          DEFAULT_PLAN_HEADER = {
              "planName": "复诊复查指导",
              "planTitle": "个性化复诊复查安排",
              "planSummary": "本方案围绕患者当前健康状况和复诊复查需求，提供可执行的复诊复查安排。",
              "executionPoints": "优先完成重点复查项目；复查结果及时回传给医生或健管师；如出现连续指标异常、明显不适或用药中断，应提前联系医生或健管师。",
          }


          def _parse_json(value, default):
              if value is None or value == "":
                  return default
              if isinstance(value, (dict, list)):
                  return value
              if isinstance(value, str):
                  stripped = value.strip()
                  if not stripped:
                      return default
                  try:
                      return json.loads(stripped)
                  except json.JSONDecodeError:
                      start = stripped.find("{")
                      end = stripped.rfind("}")
                      if start >= 0 and end > start:
                          try:
                              return json.loads(stripped[start:end + 1])
                          except json.JSONDecodeError:
                              return default
              return default


          def _text(value, fallback):
              if value is None:
                  return fallback
              text = str(value).strip()
              return text if text else fallback


          def main(llmOutput=None, llmText=None, text=None, **kwargs) -> dict:
              raw = llmOutput if llmOutput is not None else llmText if llmText is not None else text
              parsed = _parse_json(raw, {})
              if not isinstance(parsed, dict):
                  parsed = {}

              fallback_fields = []
              plan_header = {}
              for key, fallback in DEFAULT_PLAN_HEADER.items():
                  if not parsed.get(key):
                      fallback_fields.append(key)
                  plan_header[key] = _text(parsed.get(key), fallback)

              return {
                  "planHeader": plan_header,
                  "planHeaderText": json.dumps(plan_header, ensure_ascii=False),
                  "planName": plan_header["planName"],
                  "planTitle": plan_header["planTitle"],
                  "planSummary": plan_header["planSummary"],
                  "executionPoints": plan_header["executionPoints"],
                  "fallbackFields": fallback_fields,
                  "fallbackFieldsCount": len(fallback_fields),
              }
