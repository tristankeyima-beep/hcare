            7. 不承诺治愈、逆转疾病，不输出药物调整建议。
            8. 避免冷冰冰的统计口吻；不要把 `planSummary` 写成“指标记录3条、饮食记录2条”的流水账，除非这些数字对患者理解非常关键。

