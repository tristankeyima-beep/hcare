        code: |
          import json

          FIELDS = {
              "medicalStatusSummary": "本节点输入为空或信息不足，暂无可提炼的疾病状态和指标目标摘要。",
              "reviewNeedSummary": "本节点输入为空或信息不足，暂无可提炼的复诊复查需求摘要。",
              "safetyTriggerSummary": "本节点输入为空或信息不足，暂无可提炼的提前就医触发和安全边界摘要。",
          }


          def _parse_json(value, default):
              if value is None or value == "":
                  return default
              if isinstance(value, (dict, list)):
                  return value
              if isinstance(value, str):
                  stripped = value.strip()
                  if not stripped:
                      return default
                  try:
                      return json.loads(stripped)
                  except json.JSONDecodeError:
                      start = stripped.find("{")
                      end = stripped.rfind("}")
                      if start >= 0 and end > start:
                          try:
                              return json.loads(stripped[start:end + 1])
                          except json.JSONDecodeError:
                              return default
              return default


          def _text(value, fallback):
              if value is None:
                  return fallback
              text = str(value).strip()
              return text if text else fallback


          def main(llmOutput=None, llmText=None, text=None, planGoalAndRequirements="", extraSupplement="", **kwargs) -> dict:
              raw = llmOutput if llmOutput is not None else llmText if llmText is not None else text
              parsed = _parse_json(raw, {})
              if not isinstance(parsed, dict):
                  parsed = {}

              missing = []
              bundle = {}
              for key, fallback in FIELDS.items():
                  if not parsed.get(key):
                      missing.append(key)
                  bundle[key] = _text(parsed.get(key), fallback)

              return {
                  "materialSummaryBundle": bundle,
                  "materialSummaryBundleText": json.dumps(bundle, ensure_ascii=False),
                  "medicalStatusSummary": bundle["medicalStatusSummary"],
                  "reviewNeedSummary": bundle["reviewNeedSummary"],
                  "safetyTriggerSummary": bundle["safetyTriggerSummary"],
                  "planGoalAndRequirements": planGoalAndRequirements or "",
                  "extraSupplement": extraSupplement or "",
                  "summaryMissingFields": missing,
                  "summaryMissingFieldsCount": len(missing),
              }
