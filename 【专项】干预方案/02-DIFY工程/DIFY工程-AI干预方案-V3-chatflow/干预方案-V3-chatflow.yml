            \ {{#17788063898390.materialSummaryBundleText#}}\n\n\n# 任务\n你是一名慢病运动健康处方生成助手。\n\
            \n\n请根据全部素材摘要、健管师本次方案目标和额外要求，一次性完成运动方案分组规划和各分组建议生成，输出 `groupPlan` 和 `groups`\
