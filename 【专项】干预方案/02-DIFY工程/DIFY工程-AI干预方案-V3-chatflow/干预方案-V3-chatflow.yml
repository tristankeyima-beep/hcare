            这个阶段会把健康画像、目标校准和饮食行动方向，进一步转成 7 天饮食执行安排。重点是让每天的搭配都服务于同一个健康目标，体现餐单背后的专业取舍。



            # 工作方式

            输出：餐单主线是什么，每餐结构如何平衡，哪些地方需要因为安全或资料不足而稳妥处理。把注意力放在控糖、控脂、营养搭配、执行便利性和安全边界之间的取舍。



