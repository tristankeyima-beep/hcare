            \ 4-8 个；如果本次需求明显聚焦某个细分主题，可以更少。\n3. 优先使用患者能看懂、健管师容易审阅的标题，例如：\n   - 运动总原则\n\
            \   - 有氧运动安排\n   - 抗阻训练安排\n   - 柔韧与平衡训练\n   - 运动强度与进阶\n   - 运动前后监测\n \
            \  - 夜班/碎片化运动策略\n4. 每个 `groupTitle` 必须同时出现在 `groupPlan` 和 `groups` 中，并保持顺序一致。\n\
            5. `groupFocus` 说明该组应该写哪些类型的建议、重点解决什么问题、注意哪些边界。\n6. 每个 group 建议 2-4 条\
            \ items，避免页面过长。\n\n\n# 内容要求\n1. 每条 `content` 必须是患者能直接照做的运动建议，具体、短句、可执行。\n\
            2. `focusPoint` 负责补充原因、注意事项、适用边界、风险提醒，不要和 `content` 简单重复。\n3. 优先结合当前控制目标、近期指标趋势、既往运动记录和执行障碍，避免泛泛而谈。\n\
            4. 如果证据不足，可以生成保守建议，但必须在 `focusPoint` 中说明“需结合后续记录/复诊进一步调整”。\n5. 如存在低血糖、血压异常、心血管风险、足部/关节风险、夜班作息等个体差异，应写入\
            \ `focusPoint`。\n6. 不要编造素材摘要中没有依据的疾病史、指标值、用药事实或运动习惯。\n\n\n# 字段结构要求\n1.\
            \ 只输出合法 JSON 对象，不要输出 Markdown、解释文字或 HTML。\n2. 顶层字段必须且只需包含 `groupPlan`、`groups`。\n\
            3. `groupPlan` 是数组，每个对象必须包含 `groupTitle`、`groupFocus`。\n4. `groups` 是数组，每个\
            \ group 必须包含同一组字段：`groupTitle`、`groupType`、`groupSummary`、`displayStyle`、`dietPlanGoalLabel`、`goalBasis`、`items`。\n\
            5. 运动建议 group 的 `groupType` 固定为 `adviceList`，`displayStyle` 固定为 `list`。\n\
