            7. 运动建议 item 的 `itemType` 固定为 `advice`。\n8. 不适用的字段也必须给出，值用空字符串 `\"\"`\
            \ 或空数组 `[]`，不要省略字段。\n9. `importance` 只能取：`重点执行` / `常规建议` / `补充建议`。\n\n\
            \n# 输出格式\n```json\n{\n  \"groupPlan\": [\n    {\n      \"groupTitle\"\
            : \"有氧运动安排\",\n      \"groupFocus\": \"围绕运动方式、频率、单次时长、适合场景和血糖血压监测生成建议。\"\
