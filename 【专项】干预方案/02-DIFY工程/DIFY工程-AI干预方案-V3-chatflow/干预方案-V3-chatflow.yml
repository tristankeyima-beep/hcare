            如果缺少身高、肾功能、糖化血红蛋白或血脂细分等精确信息，先采用稳妥份量和基础搭配。只有材料明确支持夜班、食堂、外卖等场景时，才展开对应安排；一般情况下，兼顾日常准备便利性和可坚持性。



