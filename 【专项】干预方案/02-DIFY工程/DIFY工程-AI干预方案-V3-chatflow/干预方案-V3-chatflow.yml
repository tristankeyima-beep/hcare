    - data:
        code: "import json\n\n\nSUMMARY_FALLBACKS = {\n    \"medicalGoalSummary\"\
          : \"本节点输入为空或信息不足，暂无可提炼的疾病边界与指标目标摘要。\",\n    \"sportExecutionSummary\": \"\
          本节点输入为空或信息不足，暂无可提炼的运动能力与执行问题摘要。\",\n    \"safetyBoundarySummary\": \"本节点输入为空或信息不足，暂无可提炼的运动安全风险与边界摘要。\"\
          \n}\n\n\ndef _parse_json(value, default):\n    if value is None or value\
          \ == \"\":\n        return default\n    if isinstance(value, (dict, list)):\n\
          \        return value\n    if isinstance(value, str):\n        stripped\
          \ = value.strip()\n        if not stripped:\n            return default\n\
          \        try:\n            return json.loads(stripped)\n        except json.JSONDecodeError:\n\
          \            start = stripped.find(\"{\")\n            end = stripped.rfind(\"\
          }\")\n            if start >= 0 and end > start:\n                try:\n\
          \                    return json.loads(stripped[start:end + 1])\n      \
          \          except json.JSONDecodeError:\n                    return default\n\
          \    return default\n\n\ndef _normalize_text(value, fallback):\n    if value\
          \ is None:\n        return fallback\n    if isinstance(value, (dict, list)):\n\
          \        text = json.dumps(value, ensure_ascii=False)\n    else:\n     \
          \   text = str(value)\n    text = text.strip()\n    return text if text\
          \ else fallback\n\n\ndef _extract_summary(parsed, key):\n    fallback =\
          \ SUMMARY_FALLBACKS[key]\n    if isinstance(parsed, dict):\n        return\
          \ _normalize_text(parsed.get(key), fallback)\n    return fallback\n\n\n\
          def main(\n    llmOutput=None,\n    medicalGoalSummary=None,\n    sportExecutionSummary=None,\n\
          \    safetyBoundarySummary=None,\n    planGoalAndRequirements: str = \"\"\
          ,\n    extraSupplement: str = \"\",\n    **kwargs\n) -> dict:\n    parsed\
          \ = _parse_json(llmOutput, {})\n    if not isinstance(parsed, dict):\n \
          \       parsed = {}\n\n    direct = {\n        \"medicalGoalSummary\": medicalGoalSummary,\n\
          \        \"sportExecutionSummary\": sportExecutionSummary,\n        \"safetyBoundarySummary\"\
          : safetyBoundarySummary\n    }\n\n    bundle = {}\n    for key, directValue\
          \ in direct.items():\n        if directValue not in (None, \"\"):\n    \
          \        bundle[key] = _normalize_text(directValue, SUMMARY_FALLBACKS[key])\n\
          \        else:\n            bundle[key] = _extract_summary(parsed, key)\n\
          \n    missing = [\n        key\n        for key, value in bundle.items()\n\
          \        if value == SUMMARY_FALLBACKS[key]\n    ]\n\n    return {\n   \
          \     \"planGoalAndRequirements\": planGoalAndRequirements or \"\",\n  \
          \      \"extraSupplement\": extraSupplement or \"\",\n        \"medicalGoalSummary\"\
          : bundle[\"medicalGoalSummary\"],\n        \"sportExecutionSummary\": bundle[\"\
          sportExecutionSummary\"],\n        \"safetyBoundarySummary\": bundle[\"\
          safetyBoundarySummary\"],\n        \"materialSummaryBundle\": bundle,\n\
          \        \"materialSummaryBundleText\": json.dumps(bundle, ensure_ascii=False),\n\
          \        \"summaryMissingFields\": missing,\n        \"summaryMissingFieldsCount\"\
          : len(missing)\n    }\n"
