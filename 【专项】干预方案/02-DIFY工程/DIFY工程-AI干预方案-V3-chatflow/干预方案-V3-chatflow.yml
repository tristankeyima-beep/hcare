          \ llmOutput\n    return llmText\n\n\ndef main(\n    llmOutput=None,\n  \
          \  llmText=None,\n    planName: str = \"\",\n    planTitle: str = \"\",\n\
          \    planSummary: str = \"\",\n    executionPoints: str = \"\",\n    **kwargs\n\
