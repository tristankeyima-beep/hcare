<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>干预方案展示组件 - antd + Tailwind</title>
  <script src="./vendor/tailwindcss.js"></script>
  <link rel="stylesheet" href="./vendor/antd-reset.min.css" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      color: oklch(24% 0.026 255);
      background: oklch(94.5% 0.018 242);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #root {
      min-height: 100vh;
    }

    .ant-card {
      box-shadow: 0 8px 22px oklch(30% 0.025 250 / 0.07);
    }

    .ant-tabs-nav {
      position: sticky !important;
      top: 0;
      z-index: 20;
      margin: 0 -16px 16px !important;
      padding: 8px 16px 0;
      background: oklch(97% 0.012 240 / 0.94);
      border-bottom: 1px solid oklch(88% 0.018 242);
      backdrop-filter: blur(12px);
    }

    .ant-tabs-tab {
      min-height: 44px;
      padding: 10px 0 12px !important;
    }

    .ant-tabs-tab-btn {
      font-size: 14px;
      font-weight: 700;
    }

    .ant-collapse-header {
      align-items: center !important;
      min-height: 58px;
      padding: 14px 12px !important;
    }

    .ant-collapse-content-box {
      padding: 0 12px 12px !important;
    }

    .plan-shell {
      width: min(100%, 430px);
      min-height: 100vh;
      margin: 0 auto;
      background:
        linear-gradient(180deg, oklch(90% 0.04 240) 0, oklch(97% 0.012 240 / 0) 260px),
        oklch(97% 0.012 240);
    }

    .hero-panel {
      background:
        linear-gradient(135deg, oklch(38% 0.08 252), oklch(45% 0.075 226)),
        oklch(38% 0.08 252);
    }

    .soft-grid {
      background-image:
        linear-gradient(oklch(96% 0.01 240 / 0.14) 1px, transparent 1px),
        linear-gradient(90deg, oklch(96% 0.01 240 / 0.14) 1px, transparent 1px);
      background-size: 22px 22px;
    }

    .section-anchor {
      scroll-margin-top: 72px;
    }

    .readable-copy {
      max-width: 68ch;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="./vendor/react.production.min.js"></script>
  <script src="./vendor/react-dom.production.min.js"></script>
  <script src="./vendor/dayjs.min.js"></script>
  <script src="./vendor/antd.min.js"></script>
  <script src="./vendor/babel.min.js"></script>

  <script type="text/babel">
    const {
      Alert,
      App,
      Card,
      ConfigProvider,
      Skeleton,
      Space,
      Tabs,
      Tag,
      Typography,
      theme,
    } = antd;
    const { Text, Title, Paragraph } = Typography;

    const externalPatientInfo = {
      patientName: "张三",
    };

    const planSource = {
      key: "exercise",
      label: "运动方案",
      path: "./data/exercise-final-plan.json",
      tone: "sky",
    };

    function getCurrentPlanSource() {
      return planSource;
    }

    function compactText(value, fallback = "-") {
      if (value === null || value === undefined || value === "") return fallback;
      return value;
    }

    function countAdvice(plan) {
      return (plan.groups || [])
        .filter((group) => group.groupType === "adviceList")
        .reduce((total, group) => total + (group.items || []).length, 0);
    }

    function normalizeExecutionPoints(points) {
      if (Array.isArray(points)) return points.filter(Boolean);
      if (typeof points !== "string") return [];
      return points
        .split(/[；;\n]/)
        .map((point) => point.trim())
        .filter(Boolean);
    }

    function MetricPill({ label, value, suffix }) {
      return (
        <div className="rounded-lg border border-white/20 bg-white/14 px-3 py-2.5 text-white">
          <div className="text-[11px] font-medium leading-4 text-white/76">{label}</div>
          <div className="mt-0.5 text-lg font-semibold leading-6">
            {value}
            {suffix ? <span className="ml-0.5 text-xs font-medium text-white/70">{suffix}</span> : null}
          </div>
        </div>
      );
    }

    function PlanHero({ plan }) {
      const executionPoints = normalizeExecutionPoints(plan.executionPoints);

      return (
        <section className="hero-panel soft-grid px-4 pb-4 pt-[calc(env(safe-area-inset-top)+18px)] text-white">
          <div className="flex items-center justify-between gap-3">
            <div>
              <Title level={1} className="!mb-0 !mt-1 !text-[24px] !leading-8 !text-white">
                {externalPatientInfo.patientName}专属方案
              </Title>
            </div>
          </div>

          <Card className="!mt-4 !rounded-lg !border-0 !bg-[oklch(98.5%_0.008_240)]" styles={{ body: { padding: 16 } }}>
            <div className="flex items-start justify-between gap-4">
              <div>
                <Text className="text-xs font-semibold text-blue-700">{plan.planName}</Text>
                <Title level={2} className="!mb-0 !mt-1 !text-[20px] !leading-7 !text-slate-950">
                  {plan.planTitle}
                </Title>
              </div>
            </div>
            <Paragraph className="readable-copy !mb-0 !mt-3 !text-[14px] !leading-7 !text-slate-700" ellipsis={{ rows: 4, expandable: true, symbol: "展开" }}>
              {plan.planSummary}
            </Paragraph>
          </Card>

          <div className="mt-4 grid grid-cols-2 gap-2">
            <MetricPill label="执行点" value={executionPoints.length} suffix="个" />
            <MetricPill label="建议项" value={countAdvice(plan)} suffix="条" />
          </div>
        </section>
      );
    }

    function ImportanceTag({ value }) {
      const color = value === "重点执行" ? "red" : "blue";
      return <Tag color={color} className="!m-0 !rounded-full">{compactText(value, "常规建议")}</Tag>;
    }

    function AdviceCard({ item, index }) {
      return (
        <Card className="!rounded-lg !border-[oklch(90%_0.018_242)] !bg-[oklch(99%_0.004_240)]" styles={{ body: { padding: 15 } }}>
          <div className="flex flex-col gap-3">
            <div className="flex min-w-0 items-start gap-3">
              <div className="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-blue-50 text-sm font-semibold text-blue-800">
                {index + 1}
              </div>
              <div className="min-w-0">
                <div className="flex flex-wrap items-center gap-2">
                  <div className="text-[15px] font-semibold leading-6 text-slate-950">{item.title}</div>
                  <ImportanceTag value={item.importance} />
                </div>
                <div className="readable-copy mt-1.5 text-[14px] leading-7 text-slate-700">{item.content}</div>
              </div>
            </div>
          </div>
          {item.focusPoint ? (
            <Alert
              className="!mt-3 !rounded-lg !border-[oklch(88%_0.055_84)] !bg-[oklch(97%_0.028_84)]"
              type="warning"
              showIcon={false}
              message={<span className="text-[12px] font-semibold text-amber-900">关注点</span>}
              description={<span className="readable-copy text-[13px] leading-6 text-amber-950">{item.focusPoint}</span>}
            />
          ) : null}
        </Card>
      );
    }

    function AdviceGroup({ group }) {
      return (
        <section id={group.groupTitle} className="section-anchor">
          <div className="mb-3 flex items-start justify-between gap-3">
            <div>
              <Title level={3} className="!mb-1 !text-[18px] !leading-7 !text-slate-950">
                {group.groupTitle}
              </Title>
              <Text className="readable-copy text-[14px] leading-6 text-slate-600">{group.groupSummary}</Text>
            </div>
            <Tag className="!m-0 !rounded-full">{(group.items || []).length} 项</Tag>
          </div>
          <Space direction="vertical" size={10} className="w-full">
            {(group.items || []).map((item, index) => (
              <AdviceCard key={`${group.groupTitle}-${item.title}-${index}`} item={item} index={index} />
            ))}
          </Space>
        </section>
      );
    }

    function ExecutionPoints({ points }) {
      const normalizedPoints = normalizeExecutionPoints(points);
      if (!normalizedPoints.length) return null;

      return (
        <section id="executionPoints" className="section-anchor">
          <Title level={3} className="!mb-3 !text-[18px] !leading-7 !text-slate-950">执行要点</Title>
          <Card className="!rounded-lg !border-0 !bg-[oklch(99%_0.004_240)]" styles={{ body: { padding: 12 } }}>
            <Space direction="vertical" size={8} className="w-full">
              {normalizedPoints.map((point, index) => (
                <div key={`${point}-${index}`} className="flex gap-3 rounded-lg bg-[oklch(96.5%_0.012_240)] p-3.5">
                  <div className="flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-[oklch(39%_0.075_245)] text-xs font-semibold text-white">
                    {index + 1}
                  </div>
                  <div className="readable-copy text-[14px] leading-7 text-slate-800">{typeof point === "string" ? point : JSON.stringify(point)}</div>
                </div>
              ))}
            </Space>
          </Card>
        </section>
      );
    }

    function PlanContent({ plan }) {
      const adviceGroups = (plan.groups || []).filter((group) => group.groupType === "adviceList");
      const tabItems = [
        {
          key: "execution",
          label: "执行点",
          children: <ExecutionPoints points={plan.executionPoints} />,
        },
        {
          key: "overview",
          label: "建议",
          children: (
            <Space direction="vertical" size={18} className="w-full">
              {adviceGroups.map((group) => (
                <AdviceGroup key={group.groupTitle} group={group} />
              ))}
            </Space>
          ),
        },
      ].filter(Boolean);

      return (
        <div className="px-4 pb-[calc(env(safe-area-inset-bottom)+28px)] pt-4">
          <Tabs defaultActiveKey="execution" items={tabItems} />
        </div>
      );
    }

    function InterventionPlanShowcase({ plan }) {
      return (
        <main className="plan-shell">
          <PlanHero
            plan={plan}
          />
          <PlanContent plan={plan} />
        </main>
      );
    }

    function Root() {
      const [state, setState] = React.useState({ loading: true, plan: null, source: getCurrentPlanSource(), error: null });

      React.useEffect(() => {
        const source = getCurrentPlanSource();
        fetch(source.path)
          .then((response) => {
            if (!response.ok) throw new Error("方案数据加载失败");
            return response.json();
          })
          .then((plan) => {
            document.title = `${plan.planName} - antd + Tailwind`;
            setState({ loading: false, plan, source, error: null });
          })
          .catch((error) => setState({ loading: false, plan: null, source, error }));
      }, []);

      if (state.loading) {
        return (
          <div className="plan-shell px-4 py-6">
            <Skeleton active paragraph={{ rows: 12 }} />
          </div>
        );
      }

      if (state.error) {
        return (
          <div className="plan-shell px-4 py-6">
            <Alert
              type="error"
              message="方案数据加载失败"
              description="请通过本地服务访问 index.html，例如在当前目录启动静态服务后打开页面。"
            />
          </div>
        );
      }

      return <InterventionPlanShowcase plan={state.plan} />;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(
      <ConfigProvider
        theme={{
          algorithm: theme.defaultAlgorithm,
          token: {
            colorPrimary: "#2b63a3",
            borderRadius: 8,
            fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif',
          },
          components: {
            Card: { borderRadiusLG: 8 },
            Button: { borderRadius: 8 },
            Tabs: { itemSelectedColor: "#2b63a3" },
          },
        }}
      >
        <App>
          <Root />
        </App>
      </ConfigProvider>
    );
  </script>
</body>
</html>
