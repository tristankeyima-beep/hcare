<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>干预方案展示组件 - antd + Tailwind</title>
  <script src="./vendor/tailwindcss.js"></script>
  <link rel="stylesheet" href="./vendor/antd-reset.min.css" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      color: #1f2933;
      background:
        linear-gradient(180deg, rgba(42, 127, 113, 0.16) 0, rgba(246, 249, 248, 0) 280px),
        #f6f9f8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
  </style>
</head>
<body>
  <main class="mx-auto flex min-h-screen w-full max-w-[430px] flex-col px-4 py-8">
    <section class="rounded-lg bg-[#236e61] px-5 py-6 text-white shadow-lg">
      <p class="text-sm font-semibold text-white/72">antd + Tailwind 组件版</p>
      <h1 class="mt-2 text-2xl font-semibold leading-8">干预方案展示组件</h1>
      <p class="mt-3 text-sm leading-6 text-white/78">饮食方案和运动方案已拆成两个独立入口，业务展示内容来自各自的 final JSON。</p>
    </section>

    <nav class="mt-5 grid gap-3">
      <a class="rounded-lg bg-white p-4 shadow-sm ring-1 ring-slate-100" href="./diet.html">
        <div class="text-base font-semibold text-slate-900">饮食方案</div>
        <div class="mt-1 text-sm text-slate-500">加载 data/diet-final-plan.json</div>
      </a>
      <a class="rounded-lg bg-white p-4 shadow-sm ring-1 ring-slate-100" href="./exercise.html">
        <div class="text-base font-semibold text-slate-900">运动方案</div>
        <div class="mt-1 text-sm text-slate-500">加载 data/exercise-final-plan.json</div>
      </a>
    </nav>
  </main>
</body>
</html>
