<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>健康干预方案</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #2563eb;
      --primary-soft: #e8f0ff;
      --accent: #0f766e;
      --warn: #b45309;
      --border: #dbe5f0;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: linear-gradient(180deg, #eef5ff 0%, var(--bg) 220px);
      color: var(--text);
      line-height: 1.65;
    }

    .page {
      max-width: 760px;
      margin: 0 auto;
      padding: 18px 14px 36px;
    }

    .hero,
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
    }

    .hero {
      padding: 22px 18px;
      margin-bottom: 14px;
    }

    .eyebrow {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--primary-soft);
      color: var(--primary);
      font-size: 12px;
      font-weight: 700;
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    h1 {
      margin-top: 12px;
      font-size: 28px;
      line-height: 1.25;
    }

    .summary {
      margin-top: 10px;
      color: var(--muted);
      font-size: 14px;
    }

    .card {
      margin-bottom: 12px;
      padding: 16px 15px;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      gap: 12px;
    }

    .section-title h2 {
      font-size: 18px;
      line-height: 1.35;
    }

    .group-index {
      flex-shrink: 0;
      min-width: 28px;
      height: 28px;
      border-radius: 999px;
      background: var(--primary);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
    }

    .exec-box {
      background: #fdf7e7;
      border: 1px solid #f4e0a5;
      border-radius: 14px;
      padding: 14px;
      color: #7c5a05;
      font-size: 14px;
    }

    .item-list {
      display: grid;
      gap: 12px;
    }

    .plan-item {
      border: 1px solid #e6eef9;
      border-radius: 16px;
      background: #f9fbff;
      padding: 14px;
    }

    .item-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .item-no {
      color: var(--primary);
      font-size: 13px;
      font-weight: 700;
    }

    .tag {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .tag-high {
      background: #feecec;
      color: #b91c1c;
    }

    .tag-normal {
      background: var(--primary-soft);
      color: var(--primary);
    }

    .tag-low {
      background: #eafbf5;
      color: var(--accent);
    }

    .content-text {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.6;
    }

    .focus-box {
      margin-top: 10px;
      border-radius: 12px;
      border-left: 4px solid var(--primary);
      background: #fff;
      padding: 10px 12px;
    }

    .focus-label {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 4px;
    }

    .focus-text {
      font-size: 14px;
      color: #334155;
    }

    .footer {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      padding-top: 6px;
    }
  </style>
</head>
<body>
  <main class="page" id="app"></main>

  <script>
    const interventionPlanData = {
      plan_summary:
        "本方案围绕糖尿病合并血压偏高管理，重点从饮食调整、规律运动、阶段控制目标和居家监测四个方面，帮助患者稳定血糖、降低心血管风险，并提升长期自我管理能力。",
      execution_points:
        "优先落实重点执行条目；饮食和运动建议以循序渐进、可长期坚持为原则；监测数据需按固定时间记录，若连续异常或出现明显不适，应及时联系医生或健管师。",
      groups: [
        {
          group_title: "饮食干预",
          items: [
            {
              content:
                "每餐主食控制在1拳左右，优先选择燕麦、杂豆、糙米等全谷物，减少白粥、甜点和含糖饮料。",
              focus_point:
                "核心目标是降低餐后血糖波动。若近期低血糖风险增加，应先与医生确认主食调整幅度。",
              importance: "重点执行"
            },
            {
              content:
                "每天至少摄入500g左右非淀粉类蔬菜，烹饪以蒸、煮、炖、少油快炒为主。",
              focus_point:
                "注意控制烹调用油和高盐调味品，合并高血压时尤其要减少腌制食品和重口味菜品。",
              importance: "常规建议"
            }
          ]
        },
        {
          group_title: "运动干预",
          items: [
            {
              content:
                "每周至少5天进行快走、骑行或广场操等中等强度有氧运动，每次30分钟左右。",
              focus_point:
                "以微出汗、能说话但不能唱歌为宜；若出现胸闷、头晕、明显心慌，应立即停止运动。",
              importance: "重点执行"
            },
            {
              content:
                "每周安排2-3次轻阻抗训练，如弹力带、靠墙静蹲、坐姿抬腿，每次10-15分钟。",
              focus_point:
                "从低强度开始，优先保证动作安全和规律性，不建议一开始直接追求大重量或长时长。",
              importance: "补充建议"
            }
          ]
        },
        {
          group_title: "控制目标",
          items: [
            {
              content:
                "空腹血糖建议控制在4.4-7.0 mmol/L，餐后2小时血糖一般建议低于10.0 mmol/L，具体以医生个体化目标为准。",
              focus_point:
                "如年龄、合并症、低血糖风险不同，目标范围可能需要放宽或调整，应以临床医生要求为最终依据。",
              importance: "重点执行"
            },
            {
              content:
                "家庭自测血压建议逐步控制到130/80 mmHg左右；若短期难以达到，先以医生设定的阶段目标推进。",
              focus_point:
                "晨起血压偏高时，建议固定在起床后1小时内、服药前、排尿后、安静坐位状态下测量并记录。",
              importance: "常规建议"
            }
          ]
        },
        {
          group_title: "监测方案",
          items: [
            {
              content:
                "每周至少3天监测空腹血糖和餐后2小时血糖；近期调整饮食、运动或用药后，可阶段性提高监测频次。",
              focus_point:
                "建议记录监测时间、数值、当餐饮食、运动和异常感受，便于复诊时判断波动原因。",
              importance: "重点执行"
            },
            {
              content:
                "每天晨起监测1次血压，连续7天形成记录；若收缩压持续≥160 mmHg或伴随不适，应尽快联系医生。",
              focus_point:
                "血压计袖带大小要匹配上臂围，测量前至少安静休息5分钟，避免刚运动、饮咖啡后立刻测量。",
              importance: "重点执行"
            }
          ]
        }
      ]
    };

    const importanceClassMap = {
      "重点执行": "tag-high",
      "常规建议": "tag-normal",
      "补充建议": "tag-low"
    };

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function renderPlan(data) {
      const groupsHtml = (data.groups || [])
        .map((group, groupIndex) => {
          const itemsHtml = (group.items || [])
            .map((item, itemIndex) => {
              const tagClass = importanceClassMap[item.importance] || "tag-normal";

              return `
                <article class="plan-item">
                  <div class="item-top">
                    <span class="item-no">建议 ${itemIndex + 1}</span>
                    <span class="tag ${tagClass}">${escapeHtml(item.importance || "常规建议")}</span>
                  </div>
                  <p class="content-text">${escapeHtml(item.content)}</p>
                  <div class="focus-box">
                    <div class="focus-label">关注点</div>
                    <p class="focus-text">${escapeHtml(item.focus_point)}</p>
                  </div>
                </article>
              `;
            })
            .join("");

          return `
            <section class="card">
              <div class="section-title">
                <h2><span class="group-index">${groupIndex + 1}</span> ${escapeHtml(group.group_title)}</h2>
              </div>
              <div class="item-list">
                ${itemsHtml}
              </div>
            </section>
          `;
        })
        .join("");

      document.getElementById("app").innerHTML = `
        <section class="hero">
          <span class="eyebrow">健康干预方案</span>
          <h1>个性化健康管理建议</h1>
          <p class="summary">${escapeHtml(data.plan_summary)}</p>
        </section>

        <section class="card">
          <div class="section-title">
            <h2>执行要点</h2>
          </div>
          <div class="exec-box">${escapeHtml(data.execution_points)}</div>
        </section>

        ${groupsHtml}

        <p class="footer">本方案用于健康管理沟通和日常自我照护参考，不替代医生面诊、诊断和用药调整建议。</p>
      `;
    }

    renderPlan(interventionPlanData);
  </script>
</body>
</html>
