<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>健康干预方案</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #0f172a;
      --subtext: #475569;
      --muted: #64748b;
      --primary: #2563eb;
      --primary-deep: #1d4ed8;
      --soft: #eff6ff;
      --soft-2: #f8fbff;
      --line: #dbe4f0;
      --shadow: 0 18px 42px rgba(15, 23, 42, 0.1);
      --danger-bg: #fff1f2;
      --danger-text: #be123c;
      --normal-bg: #eff6ff;
      --normal-text: #2563eb;
      --low-bg: #f1f5f9;
      --low-text: #64748b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background:
        radial-gradient(circle at top right, rgba(37, 99, 235, 0.16), transparent 220px),
        linear-gradient(180deg, #eaf2ff 0%, #f5f7fb 240px, #f8fafc 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    .page {
      max-width: 760px;
      margin: 0 auto;
      padding: 16px 14px 40px;
    }

    .hero {
      position: relative;
      overflow: hidden;
      padding: 24px 20px 22px;
      border-radius: 28px;
      background: linear-gradient(145deg, #1d4ed8, #2563eb 60%, #3b82f6);
      box-shadow: var(--shadow);
      color: #fff;
    }

    .hero::after {
      content: "";
      position: absolute;
      right: -40px;
      top: -40px;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.13);
    }

    .eyebrow {
      position: relative;
      z-index: 1;
      display: inline-flex;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    h1, h2, h3, p { margin: 0; }

    h1 {
      position: relative;
      z-index: 1;
      margin-top: 14px;
      font-size: 30px;
      line-height: 1.22;
      letter-spacing: -0.03em;
    }

    .summary {
      position: relative;
      z-index: 1;
      margin-top: 12px;
      font-size: 15px;
      line-height: 1.85;
      color: rgba(255, 255, 255, 0.94);
    }

    .stats {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 18px;
    }

    .stat-box {
      padding: 14px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(6px);
    }

    .stat-label {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.82);
    }

    .stat-value {
      margin-top: 6px;
      font-size: 22px;
      font-weight: 800;
      line-height: 1.1;
    }

    .section-card {
      margin-top: 14px;
      padding: 18px 16px;
      border-radius: 24px;
      background: var(--card);
      border: 1px solid var(--line);
      box-shadow: 0 12px 26px rgba(15, 23, 42, 0.06);
    }

    .section-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 18px;
      line-height: 1.3;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .hint {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }

    .exec-box {
      padding: 14px;
      border-radius: 16px;
      background: linear-gradient(180deg, #f8fbff, #f3f7ff);
      border: 1px solid #e2eaf7;
      font-size: 15px;
      line-height: 1.9;
      color: var(--subtext);
    }

    .tab-menu {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      margin-top: 14px;
      padding: 2px 0 6px;
      scrollbar-width: none;
    }

    .tab-menu::-webkit-scrollbar {
      display: none;
    }

    .tab-btn {
      flex-shrink: 0;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.88);
      color: var(--subtext);
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 14px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.04);
    }

    .tab-btn.active {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 10px 24px rgba(37, 99, 235, 0.22);
    }

    .group-brief {
      margin-bottom: 14px;
      padding: 14px;
      border-radius: 18px;
      background: var(--soft);
      border: 1px solid #dce8fb;
    }

    .group-name {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .group-name h2 {
      font-size: 20px;
      line-height: 1.25;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .group-count {
      padding: 6px 10px;
      border-radius: 999px;
      background: #fff;
      color: var(--primary);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .group-desc {
      margin-top: 8px;
      font-size: 14px;
      line-height: 1.8;
      color: var(--subtext);
    }

    .item-list {
      display: grid;
      gap: 12px;
    }

    .plan-item {
      padding: 16px;
      border-radius: 22px;
      background: #fff;
      border: 1px solid #e7edf6;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.05);
    }

    .item-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .item-no {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--primary);
      font-size: 13px;
      font-weight: 800;
    }

    .item-no::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--primary);
    }

    .tag {
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      background: var(--low-bg);
      color: var(--low-text);
    }

    .tag-high {
      background: var(--danger-bg);
      color: var(--danger-text);
    }

    .tag-normal {
      background: var(--normal-bg);
      color: var(--normal-text);
    }

    .content-text {
      font-size: 17px;
      line-height: 1.75;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--text);
    }

    .focus-box {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 16px;
      border-left: 4px solid var(--primary);
      background: var(--soft-2);
    }

    .focus-label {
      color: var(--primary);
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .focus-text {
      font-size: 14px;
      line-height: 1.8;
      color: var(--subtext);
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <span class="eyebrow" id="planName"></span>
      <h1 id="planTitle"></h1>
      <p class="summary" id="planSummary"></p>
      <div class="stats">
        <div class="stat-box">
          <div class="stat-label">干预模块</div>
          <div class="stat-value" id="groupCount"></div>
        </div>
        <div class="stat-box">
          <div class="stat-label">建议条目</div>
          <div class="stat-value" id="itemCount"></div>
        </div>
      </div>
    </section>

    <section class="section-card">
      <div class="section-title-row">
        <h2 class="section-title">执行要点</h2>
        <span class="hint">先读这里</span>
      </div>
      <p class="exec-box" id="executionPoints"></p>
    </section>

    <nav class="tab-menu" id="tabMenu"></nav>

    <section class="section-card" id="groupPanel"></section>
  </main>

  <script>
    const planData = {
      plan_name: "健康干预方案",
      plan_title: "个性化健康管理建议",
      plan_summary: "本方案围绕糖尿病合并血压偏高管理，重点从饮食调整、规律运动、阶段控制目标和居家监测四个方面，帮助患者稳定血糖、降低心血管风险，并提升长期自我管理能力。",
      execution_points: "优先落实重点执行条目；饮食和运动建议以循序渐进、可长期坚持为原则；监测数据需按固定时间记录，若连续异常或出现明显不适，应及时联系医生或健管师。",
      groups: [
        {
          group_title: "饮食干预",
          items: [
            {
              content: "每餐主食控制在1拳左右，优先选择燕麦、杂豆、糙米等全谷物，减少白粥、甜点和含糖饮料。",
              focus_point: "核心目标是降低餐后血糖波动。若近期低血糖风险增加，应先与医生确认主食调整幅度。",
              importance: "重点执行"
            },
            {
              content: "每天至少摄入500g左右非淀粉类蔬菜，烹饪以蒸、煮、炖、少油快炒为主。",
              focus_point: "注意控制烹调用油和高盐调味品，合并高血压时尤其要减少腌制食品和重口味菜品。",
              importance: "常规建议"
            }
          ]
        },
        {
          group_title: "运动干预",
          items: [
            {
              content: "每周至少5天进行快走、骑行或广场操等中等强度有氧运动，每次30分钟左右。",
              focus_point: "以微出汗、能说话但不能唱歌为宜；若出现胸闷、头晕、明显心慌，应立即停止运动。",
              importance: "重点执行"
            },
            {
              content: "每周安排2-3次轻阻抗训练，如弹力带、靠墙静蹲、坐姿抬腿，每次10-15分钟。",
              focus_point: "从低强度开始，优先保证动作安全和规律性，不建议一开始直接追求大重量或长时长。",
              importance: "补充建议"
            }
          ]
        },
        {
          group_title: "控制目标",
          items: [
            {
              content: "空腹血糖建议控制在4.4-7.0 mmol/L，餐后2小时血糖一般建议低于10.0 mmol/L，具体以医生个体化目标为准。",
              focus_point: "如年龄、合并症、低血糖风险不同，目标范围可能需要放宽或调整，应以临床医生要求为最终依据。",
              importance: "重点执行"
            },
            {
              content: "家庭自测血压建议逐步控制到130/80 mmHg左右；若短期难以达到，先以医生设定的阶段目标推进。",
              focus_point: "晨起血压偏高时，建议固定在起床后1小时内、服药前、排尿后、安静坐位状态下测量并记录。",
              importance: "常规建议"
            }
          ]
        },
        {
          group_title: "监测方案",
          items: [
            {
              content: "每周至少3天监测空腹血糖和餐后2小时血糖；近期调整饮食、运动或用药后，可阶段性提高监测频次。",
              focus_point: "建议记录监测时间、数值、当餐饮食、运动和异常感受，便于复诊时判断波动原因。",
              importance: "重点执行"
            },
            {
              content: "每天晨起监测1次血压，连续7天形成记录；若收缩压持续≥160 mmHg或伴随不适，应尽快联系医生。",
              focus_point: "血压计袖带大小要匹配上臂围，测量前至少安静休息5分钟，避免刚运动、饮咖啡后立刻测量。",
              importance: "重点执行"
            }
          ]
        }
      ]
    };

    const groupDescMap = {
      "饮食干预": "先从主食、蔬菜、烹饪方式这类每天都能执行的饮食动作入手，帮助餐后血糖更平稳。",
      "运动干预": "以安全、规律、可持续为前提，优先安排中等强度有氧运动，再逐步补充轻阻抗训练。",
      "控制目标": "这里集中查看阶段性血糖和血压目标，便于每天对照判断当前管理状态。",
      "监测方案": "按固定时间记录关键指标和异常情况，复诊时更容易判断波动原因和调整方向。"
    };

    let activeIndex = 0;

    const escapeHtml = (value) => String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");

    const importanceClass = (importance) => {
      if (importance === "重点执行") return "tag-high";
      if (importance === "常规建议") return "tag-normal";
      return "";
    };

    function renderTabs() {
      document.getElementById("tabMenu").innerHTML = planData.groups.map((group, index) => `
        <button class="tab-btn ${index === activeIndex ? "active" : ""}" type="button" onclick="switchGroup(${index})">
          ${escapeHtml(group.group_title)}
        </button>
      `).join("");
    }

    function renderPanel() {
      const group = planData.groups[activeIndex];
      const groupDesc = groupDescMap[group.group_title] || "点击上方不同模块，查看对应的干预建议和重点说明。";

      document.getElementById("groupPanel").innerHTML = `
        <div class="group-brief">
          <div class="group-name">
            <h2>${escapeHtml(group.group_title)}</h2>
            <span class="group-count">${group.items.length} 条建议</span>
          </div>
          <p class="group-desc">${escapeHtml(groupDesc)}</p>
        </div>

        <div class="item-list">
          ${group.items.map((item, index) => `
            <article class="plan-item">
              <div class="item-top">
                <span class="item-no">建议 ${index + 1}</span>
                <span class="tag ${importanceClass(item.importance)}">${escapeHtml(item.importance)}</span>
              </div>
              <p class="content-text">${escapeHtml(item.content)}</p>
              <div class="focus-box">
                <div class="focus-label">关注点</div>
                <p class="focus-text">${escapeHtml(item.focus_point)}</p>
              </div>
            </article>
          `).join("")}
        </div>
      `;
    }

    function switchGroup(index) {
      activeIndex = index;
      renderTabs();
      renderPanel();
    }

    const totalItems = planData.groups.reduce((sum, group) => sum + (group.items || []).length, 0);

    document.getElementById("planName").textContent = planData.plan_name;
    document.getElementById("planTitle").textContent = planData.plan_title;
    document.getElementById("planSummary").textContent = planData.plan_summary;
    document.getElementById("executionPoints").textContent = planData.execution_points;
    document.getElementById("groupCount").textContent = `${planData.groups.length} 组`;
    document.getElementById("itemCount").textContent = `${totalItems} 条`;

    renderTabs();
    renderPanel();
  </script>
</body>
</html>
