<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>饮食健康处方</title>
  <style>
    :root {
      --color-primary: #4fa99f;
      --color-primary-deep: #3b8f86;
      --color-primary-dark: #2f736d;
      --color-primary-soft: #edf7f5;
      --color-primary-pale: #f4fbf9;
      --color-success: #7bbf9a;
      --color-warning: #f1b36b;
      --color-danger: #e88484;
      --color-bg: #f7f9f8;
      --color-weak-bg: #f8fbfa;
      --color-card: #ffffff;
      --color-line: #e9efed;
      --color-line-strong: #dfe9e6;
      --color-text-main: #24313a;
      --color-text-secondary: #6f7b83;
      --color-text-muted: #9aa5ac;
      --color-white: #ffffff;
      --font-xs: 11px;
      --font-sm: 12px;
      --font-body: 15px;
      --font-md: 16px;
      --font-title: 17px;
      --font-main-card: 20px;
      --font-page: 24px;
      --space-page: 16px;
      --space-section: 20px;
      --space-related: 14px;
      --space-card: 16px;
      --space-gap: 10px;
      --radius-xs: 8px;
      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 18px;
      --radius-nav: 20px;
      --shadow-card: 0 4px 14px rgba(36, 49, 58, 0.04);
      --shadow-primary: 0 8px 22px rgba(62, 156, 146, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: #eef3f1;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--color-text-main);
      background:
        linear-gradient(180deg, rgba(79, 169, 159, 0.12) 0%, rgba(247, 249, 248, 0) 260px),
        var(--color-bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: var(--font-body);
      line-height: 1.6;
    }

    button {
      font: inherit;
    }

    .phone {
      width: min(100%, 430px);
      min-height: 100vh;
      margin: 0 auto;
      background: var(--color-bg);
      position: relative;
      overflow: hidden;
    }

    main {
      padding: 0 var(--space-page) 104px;
    }

    .cover {
      min-height: min(70vh, 560px);
      padding: 18px 0 16px;
      display: grid;
      align-content: start;
      position: relative;
      overflow: hidden;
    }

    .cover::before {
      content: "";
      position: absolute;
      inset: 4px -34px auto auto;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(79, 169, 159, 0.16), rgba(79, 169, 159, 0) 68%);
      pointer-events: none;
    }

    .cover::after {
      content: "";
      position: absolute;
      left: -52px;
      bottom: 72px;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(241, 179, 107, 0.18), rgba(241, 179, 107, 0) 66%);
      pointer-events: none;
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    .cover-stage {
      position: relative;
      z-index: 1;
      min-height: 486px;
      display: grid;
      align-items: end;
      justify-items: center;
    }

    .cover-sheet {
      width: 74%;
      max-width: 270px;
      min-height: 282px;
      padding: 18px 16px 15px;
      border: 1px solid rgba(79, 169, 159, 0.24);
      border-radius: 18px;
      background: linear-gradient(180deg, #ffffff 0%, #f8fbfa 100%);
      box-shadow: 0 18px 34px rgba(36, 49, 58, 0.12);
      transform: rotate(-4deg);
      transform-origin: center;
      position: relative;
    }

    .cover-sheet::before {
      content: "";
      position: absolute;
      left: 18px;
      right: 18px;
      top: 50px;
      height: 1px;
      background: var(--color-line);
    }

    .clip {
      position: absolute;
      left: 18px;
      top: -10px;
      width: 26px;
      height: 36px;
      border-radius: 13px 13px 8px 8px;
      background: var(--color-primary);
      transform: rotate(-18deg);
      box-shadow: 0 8px 14px rgba(47, 115, 109, 0.18);
    }

    .sheet-year {
      display: block;
      text-align: right;
      color: var(--color-primary);
      font-size: var(--font-xs);
      font-weight: 700;
    }

    .sheet-title {
      margin-top: 14px;
      font-size: var(--font-main-card);
      line-height: 1.3;
      font-weight: 700;
      text-align: center;
    }

    .sheet-patient {
      display: flex;
      justify-content: center;
      margin-top: 8px;
    }

    .sheet-patient span {
      max-width: 100%;
      min-height: 26px;
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--color-primary-soft);
      color: var(--color-primary-dark);
      font-size: var(--font-sm);
      font-weight: 700;
      line-height: 1.25;
    }

    .sheet-subtitle {
      margin-top: 6px;
      color: var(--color-text-muted);
      font-size: var(--font-sm);
      line-height: 1.45;
      text-align: center;
    }

    .plate-art {
      width: 144px;
      height: 144px;
      margin: 20px auto 0;
      border-radius: 50%;
      background:
        conic-gradient(from 16deg, #f28e79 0 32%, #fff1d4 32% 68%, #b54c3d 68% 100%);
      border: 12px solid #fff8ef;
      box-shadow:
        inset 0 0 0 8px rgba(255, 188, 148, 0.56),
        0 12px 24px rgba(181, 76, 61, 0.18);
      position: relative;
    }

    .plate-art::before {
      content: "";
      position: absolute;
      inset: 27px;
      border-radius: 50%;
      border: 8px solid rgba(255, 255, 255, 0.72);
    }

    .sheet-foot {
      margin-top: 16px;
      color: var(--color-primary-dark);
      font-size: var(--font-sm);
      font-weight: 700;
      text-align: center;
    }

    .cover-ribbon {
      width: 100%;
      margin-top: -34px;
      padding: 42px 14px 14px;
      border: 1px solid rgba(79, 169, 159, 0.18);
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: var(--shadow-card);
    }

    .cover-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      overflow: hidden;
      border: 1px solid var(--color-line);
      border-radius: var(--radius-md);
      background: var(--color-line);
    }

    .cover-stat {
      min-width: 0;
      padding: 12px 8px;
      background: linear-gradient(180deg, #ffffff, var(--color-primary-pale));
      text-align: center;
    }

    .cover-stat strong {
      display: block;
      color: var(--color-primary-dark);
      font-size: var(--font-title);
      line-height: 1.25;
      font-weight: 700;
    }

    .cover-stat span {
      display: block;
      margin-top: 4px;
      color: var(--color-text-muted);
      font-size: var(--font-xs);
      line-height: 1.25;
    }

    .cover-hint {
      margin-top: 10px;
      color: var(--color-text-muted);
      font-size: var(--font-sm);
      text-align: center;
    }

    .card {
      margin-top: var(--space-section);
      padding: var(--space-card);
      border: 1px solid var(--color-line);
      border-radius: var(--radius-lg);
      background: var(--color-card);
      box-shadow: var(--shadow-card);
    }

    .card-primary {
      border-color: rgba(79, 169, 159, 0.24);
      box-shadow: var(--shadow-primary);
      position: relative;
      overflow: hidden;
    }

    .card-primary::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 4px;
      background: var(--color-primary);
    }

    .section-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: var(--font-title);
      line-height: 1.35;
      font-weight: 700;
    }

    .section-note {
      flex: 0 0 auto;
      color: var(--color-text-muted);
      font-size: var(--font-sm);
      line-height: 1.4;
    }

    .today-title {
      font-size: var(--font-main-card);
      line-height: 1.35;
      font-weight: 700;
    }

    .today-desc {
      margin-top: 8px;
      color: var(--color-text-secondary);
      font-size: var(--font-body);
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 14px;
    }

    .metric {
      min-width: 0;
      padding: 10px 8px;
      border-radius: var(--radius-md);
      background: var(--color-primary-pale);
      border: 1px solid var(--color-line);
    }

    .metric strong {
      display: block;
      font-size: var(--font-md);
      line-height: 1.2;
      color: var(--color-primary-dark);
      font-weight: 700;
    }

    .metric span {
      display: block;
      margin-top: 4px;
      color: var(--color-text-muted);
      font-size: var(--font-xs);
      line-height: 1.25;
    }

    .soft-box {
      padding: 12px 14px;
      border-radius: var(--radius-md);
      background: var(--color-weak-bg);
      border: 1px solid var(--color-line);
      color: var(--color-text-secondary);
      font-size: var(--font-body);
      line-height: 1.65;
    }

    .warning-box {
      background: #fffaf2;
      border-color: #f5e1be;
      color: #72512a;
    }

    .advice-list {
      display: grid;
      gap: var(--space-gap);
    }

    .advice-item {
      padding: 14px;
      border: 1px solid var(--color-line);
      border-radius: var(--radius-md);
      background: var(--color-weak-bg);
    }

    .advice-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .advice-title {
      font-size: var(--font-md);
      line-height: 1.4;
      font-weight: 700;
    }

    .tag {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 4px 9px;
      border-radius: 999px;
      background: #fff7ec;
      color: #93652c;
      font-size: var(--font-sm);
      font-weight: 700;
      white-space: nowrap;
    }

    .advice-content {
      color: var(--color-text-main);
      font-size: var(--font-body);
      line-height: 1.65;
    }

    .focus-text {
      margin-top: 8px;
      padding-left: 10px;
      border-left: 3px solid var(--color-primary);
      color: var(--color-text-secondary);
      font-size: var(--font-sm);
      line-height: 1.55;
    }

    .day-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin: 0 -16px 14px;
      padding: 0 16px 2px;
      scrollbar-width: none;
    }

    .day-tabs::-webkit-scrollbar {
      display: none;
    }

    .day-tab {
      flex: 0 0 auto;
      min-width: 58px;
      min-height: 44px;
      padding: 8px 12px;
      border: 1px solid var(--color-line);
      border-radius: var(--radius-md);
      background: var(--color-white);
      color: var(--color-text-secondary);
      font-size: var(--font-sm);
      font-weight: 700;
      text-align: center;
      cursor: pointer;
    }

    .day-tab.active {
      border-color: var(--color-primary);
      background: var(--color-primary-soft);
      color: var(--color-primary-dark);
    }

    .day-tab span {
      display: block;
      margin-top: 2px;
      color: inherit;
      font-size: var(--font-xs);
      font-weight: 500;
    }

    .day-panel {
      border-top: 1px solid var(--color-line);
      padding-top: 14px;
    }

    .day-title-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }

    .day-title {
      font-size: var(--font-title);
      line-height: 1.35;
      font-weight: 700;
    }

    .goal-pill {
      flex: 0 0 auto;
      display: inline-flex;
      min-height: 28px;
      align-items: center;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--color-primary-soft);
      color: var(--color-primary-dark);
      font-size: var(--font-sm);
      font-weight: 700;
    }

    .day-desc {
      margin-top: 8px;
      color: var(--color-text-secondary);
      font-size: var(--font-body);
      line-height: 1.65;
    }

    .meal-list {
      display: grid;
      gap: var(--space-gap);
      margin-top: 14px;
    }

    .meal {
      border: 1px solid var(--color-line);
      border-radius: var(--radius-md);
      background: var(--color-white);
      overflow: hidden;
    }

    .meal-head {
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--color-weak-bg);
      border-bottom: 1px solid var(--color-line);
    }

    .meal-name {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: var(--font-md);
      font-weight: 700;
    }

    .meal-icon {
      width: 30px;
      height: 30px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--color-primary-dark);
      background: var(--color-primary-soft);
    }

    .meal-icon svg {
      width: 17px;
      height: 17px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .meal-kcal {
      flex: 0 0 auto;
      color: var(--color-primary-dark);
      font-size: var(--font-sm);
      font-weight: 700;
    }

    .food-list {
      display: grid;
      gap: 8px;
      padding: 12px 14px 14px;
    }

    .food {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: baseline;
      min-height: 28px;
    }

    .food-name {
      min-width: 0;
      color: var(--color-text-main);
      font-size: var(--font-body);
      font-weight: 500;
      overflow-wrap: anywhere;
    }

    .food-meta {
      color: var(--color-text-muted);
      font-size: var(--font-sm);
      white-space: nowrap;
    }

    .bottom-action {
      position: fixed;
      left: 50%;
      bottom: 0;
      width: min(100%, 430px);
      transform: translateX(-50%);
      padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
      background: rgba(255, 255, 255, 0.94);
      border-top: 1px solid var(--color-line);
      backdrop-filter: blur(12px);
      display: grid;
      grid-template-columns: 104px 1fr;
      gap: 10px;
      z-index: 20;
    }

    .btn {
      min-height: 44px;
      border: 1px solid var(--color-line-strong);
      border-radius: var(--radius-md);
      background: var(--color-white);
      color: var(--color-primary-dark);
      font-size: var(--font-body);
      font-weight: 700;
      cursor: pointer;
    }

    .btn-primary {
      border-color: var(--color-primary);
      background: var(--color-primary);
      color: var(--color-white);
      box-shadow: var(--shadow-primary);
    }

    @media (min-width: 700px) {
      body {
        padding: 24px 0;
      }

      .phone {
        min-height: calc(100vh - 48px);
        border: 1px solid rgba(36, 49, 58, 0.08);
        border-radius: 28px;
        box-shadow: 0 18px 44px rgba(36, 49, 58, 0.12);
      }
    }

    @media (max-width: 370px) {
      .cover {
        min-height: min(70vh, 540px);
      }

      .cover-sheet {
        width: 78%;
        min-height: 270px;
      }

      .plate-art {
        width: 128px;
        height: 128px;
      }

      .metric-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .bottom-action {
        grid-template-columns: 96px 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="phone">
    <main>
      <section class="cover" id="coverSection">
        <div class="cover-stage">
          <div class="cover-sheet" aria-hidden="true">
            <span class="clip"></span>
            <span class="sheet-year" id="sheetPlanName"></span>
            <h1 class="sheet-title" id="sheetPlanTitle"></h1>
            <div class="sheet-patient"><span id="sheetPatientName"></span></div>
            <div class="sheet-subtitle" id="sheetGroupTitle"></div>
            <div class="plate-art"></div>
            <div class="sheet-foot" id="sheetGoalLabel"></div>
          </div>
          <div class="cover-ribbon">
            <div class="cover-stats" id="coverStats"></div>
            <div class="cover-hint">向下查看今天先吃什么</div>
          </div>
        </div>
      </section>

      <section class="card card-primary" id="todayCard"></section>

      <section class="card">
        <div class="section-head">
          <h2 class="section-title">执行要点</h2>
          <span class="section-note">先按这几条做</span>
        </div>
        <p class="soft-box warning-box" id="executionPoints"></p>
      </section>

      <section class="card">
        <div class="section-head">
          <h2 class="section-title" id="adviceSectionTitle"></h2>
          <span class="section-note" id="adviceCount"></span>
        </div>
        <div class="advice-list" id="adviceList"></div>
      </section>

      <section class="card" id="weeklySection">
        <div class="section-head">
          <h2 class="section-title" id="weeklySectionTitle"></h2>
          <span class="section-note" id="weekSummary"></span>
        </div>
        <div class="day-tabs" id="dayTabs" aria-label="选择第几天菜谱"></div>
        <div class="day-panel" id="dayPanel"></div>
      </section>
    </main>

    <div class="bottom-action">
      <button class="btn" type="button">问健管师</button>
      <button class="btn btn-primary" type="button" onclick="document.getElementById('weeklySection').scrollIntoView({behavior:'smooth', block:'start'})">查看今日三餐</button>
    </div>
  </div>

        <div class="section-head">
          <div>
            <h2 class="today-title">今天先按${escapeHtml(today.title)}执行</h2>
            <p class="today-desc">${escapeHtml(today.content)}</p>
          </div>
          <span class="goal-pill">${escapeHtml(weeklyGroup.diet_plan_goal_label || "饮食计划")}</span>
        </div>
        ${renderMetrics(today)}
        <p class="focus-text">${escapeHtml(today.focus_point)}</p>
      `;
    }

    function renderAdvice() {
      const adviceItems = adviceGroups.flatMap((group) =>
        group.items.map((item) => ({ ...item, group_title: group.group_title, group_summary: group.group_summary }))
      );

      document.getElementById("adviceCount").textContent = `${adviceItems.length} 条重点`;
      document.getElementById("adviceList").innerHTML = adviceItems.map((item) => `
        <article class="advice-item">
          <div class="advice-top">
            <h3 class="advice-title">${escapeHtml(item.title)}</h3>
            <span class="tag">${escapeHtml(item.importance)}</span>
          </div>
          <p class="advice-content">${escapeHtml(item.content)}</p>
          <p class="focus-text">${escapeHtml(item.focus_point)}</p>
        </article>
      `).join("");
    }

    function renderDayTabs() {
      document.getElementById("dayTabs").innerHTML = weeklyItems.map((day, index) => `
        <button class="day-tab ${index === activeDayIndex ? "active" : ""}" type="button" onclick="switchDay(${index})">
          第 ${day.day} 天
          <span>${day.daily_total_kcal} 千卡</span>
        </button>
      `).join("");
    }

    function renderDayPanel() {
      const day = weeklyItems[activeDayIndex];
      document.getElementById("dayPanel").innerHTML = `
        <div class="day-title-row">
          <h3 class="day-title">${escapeHtml(day.title)}三餐安排</h3>
          <span class="goal-pill">${escapeHtml(day.importance)}</span>
        </div>
        <p class="day-desc">${escapeHtml(day.content)}</p>
        ${renderMetrics(day)}
        <p class="focus-text">${escapeHtml(day.focus_point)}</p>
        <div class="meal-list">
          ${day.meals.map((meal) => `
            <article class="meal">
              <div class="meal-head">
                <div class="meal-name">
                  <span class="meal-icon">${iconPlate}</span>
                  <span>${escapeHtml(meal.meal_name)}</span>
                </div>
                <span class="meal-kcal">${meal.meal_total_kcal} 千卡</span>
              </div>
              <div class="food-list">
                ${meal.foods.map((food) => `
                  <div class="food">
                    <span class="food-name">${escapeHtml(food.name)}</span>
                    <span class="food-meta">${food.amount_g}g · ${food.kcal}千卡</span>
                  </div>
                `).join("")}
              </div>
            </article>
          `).join("")}
        </div>
      `;
    }

    function switchDay(index) {
      activeDayIndex = index;
      renderDayTabs();
      renderDayPanel();
    }

    document.getElementById("sheetPlanName").textContent = planData.plan_name;
    document.getElementById("sheetPlanTitle").textContent = planData.plan_title;
    document.getElementById("sheetPatientName").textContent = `${externalPatientInfo.patient_name}专属方案`;
    document.getElementById("sheetGroupTitle").textContent = weeklyGroup.group_title;
    document.getElementById("sheetGoalLabel").textContent = `目标：${weeklyGroup.diet_plan_goal_label}`;
    document.getElementById("executionPoints").textContent = planData.execution_points;
    document.getElementById("adviceSectionTitle").textContent = adviceGroups.map((group) => group.group_title).join(" / ");
    document.getElementById("weeklySectionTitle").textContent = weeklyGroup.group_title;
    document.getElementById("weekSummary").textContent = `日均 ${average(weeklyItems, "daily_total_kcal")} 千卡`;

    renderCoverStats();
    renderTodayCard();
    renderAdvice();
    renderDayTabs();
    renderDayPanel();
  </script>
</body>
</html>
