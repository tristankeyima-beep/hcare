<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>运动方案H5demo_插图版</title>
  <style>
    :root {
      --bg: #f4f7f5;
      --surface: #ffffff;
      --surface-soft: #f8fbf9;
      --ink: #1f2a31;
      --muted: #64737c;
      --quiet: #9aa6ac;
      --line: #e3ebe6;
      --line-strong: #d1ded7;
      --green: #3f8f72;
      --green-deep: #27674f;
      --green-soft: #eaf6ef;
      --blue: #3f73a8;
      --blue-soft: #edf4fb;
      --amber: #b9792e;
      --amber-soft: #fff4df;
      --red: #bd5a55;
      --red-soft: #fff0ef;
      --shadow: 0 10px 28px rgba(31, 42, 49, 0.08);
      --radius-xs: 8px;
      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 18px;
      --page-x: 16px;
      --nav-h: 68px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: #e7eeea;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(180deg, #e9f3ec 0, rgba(244, 247, 245, 0) 320px),
        var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: 15px;
      line-height: 1.62;
    }

    button {
      font: inherit;
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    .phone {
      width: min(100%, 430px);
      min-height: 100vh;
      margin: 0 auto;
      background: var(--bg);
      position: relative;
      overflow: hidden;
    }

    .hero {
      padding: 8px var(--page-x) 0;
      position: relative;
    }

    .cover {
      margin-top: 0;
      min-height: min(76vh, 650px);
      padding: 8px 0 16px;
      display: grid;
      align-content: start;
      position: relative;
      overflow: hidden;
    }

    .cover::before {
      content: "";
      position: absolute;
      inset: 4px -42px auto auto;
      width: 188px;
      height: 188px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(63, 143, 114, 0.18), rgba(63, 143, 114, 0) 68%);
      pointer-events: none;
    }

    .cover::after {
      content: "";
      position: absolute;
      left: -54px;
      bottom: 76px;
      width: 154px;
      height: 154px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(63, 115, 168, 0.14), rgba(63, 115, 168, 0) 66%);
      pointer-events: none;
    }

    .cover-stage {
      min-height: 508px;
      display: grid;
      align-items: end;
      justify-items: center;
      position: relative;
      z-index: 1;
    }

    .cover-sheet {
      width: 86%;
      min-height: 430px;
      padding: 22px 18px 18px;
      border: 1px solid rgba(63, 143, 114, 0.24);
      border-radius: 20px;
      background: linear-gradient(180deg, #ffffff 0%, #f8fbf9 100%);
      box-shadow: 0 18px 36px rgba(31, 42, 49, 0.13);
      transform: rotate(-2.4deg);
      transform-origin: center;
      position: relative;
    }

    .cover-sheet::before {
      content: "";
      position: absolute;
      left: 18px;
      right: 18px;
      top: 76px;
      height: 1px;
      background: var(--line);
    }

    .cover-sheet > *:not(.clip) {
      position: relative;
      z-index: 1;
    }

    .clip {
      position: absolute;
      left: 20px;
      top: -11px;
      width: 28px;
      height: 38px;
      border-radius: 14px 14px 8px 8px;
      background: var(--green);
      transform: rotate(-18deg);
      box-shadow: 0 8px 14px rgba(39, 103, 79, 0.2);
    }

    .cover-ribbon {
      width: 100%;
      margin-top: -36px;
      padding: 42px 14px 14px;
      border: 1px solid rgba(63, 143, 114, 0.18);
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: var(--shadow);
      position: relative;
      z-index: 0;
    }

    .cover-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: relative;
      z-index: 1;
    }

    .plan-badge {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--green-soft);
      color: var(--green-deep);
      font-size: 12px;
      font-weight: 800;
    }

    .plan-date {
      color: var(--quiet);
      font-size: 12px;
      font-weight: 700;
    }

    .cover-title {
      margin-top: 26px;
      font-size: 24px;
      line-height: 1.18;
      letter-spacing: 0;
      font-weight: 850;
    }

    .cover-patient {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      margin-top: 12px;
      padding: 5px 12px;
      border-radius: 999px;
      background: #eef8f3;
      color: var(--green-deep);
      font-size: 13px;
      font-weight: 800;
    }

    .cover-summary {
      margin-top: 12px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.72;
    }

    .motion-card {
      margin-top: 16px;
      min-height: 122px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: #fbfdfb;
      display: grid;
      grid-template-columns: 118px 1fr;
      gap: 10px;
      align-items: center;
    }

    .motion-illustration {
      width: 118px;
      height: 116px;
      position: relative;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background:
        radial-gradient(circle at 52% 58%, rgba(255, 255, 255, 0.98) 0 48%, rgba(234, 246, 239, 0.94) 49% 100%);
      border: 1px solid rgba(63, 143, 114, 0.18);
      box-shadow: 0 8px 18px rgba(31, 42, 49, 0.06);
      overflow: hidden;
    }

    .motion-illustration::before {
      content: "";
      position: absolute;
      inset: 13px;
      border-radius: 50%;
      border: 1px dashed rgba(63, 143, 114, 0.28);
    }

    .motion-illustration img {
      width: 104px;
      height: 130px;
      object-fit: contain;
      position: relative;
      z-index: 1;
      transform: translateY(2px);
      filter: drop-shadow(0 8px 10px rgba(39, 103, 79, 0.12));
      opacity: 1;
      transition: opacity 260ms ease, transform 260ms ease;
    }

    .motion-illustration img.is-switching {
      opacity: 0;
      transform: translateY(8px) scale(0.96);
    }

    .motion-dots {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 8px;
      z-index: 2;
      display: flex;
      justify-content: center;
      gap: 5px;
    }

    .motion-dot {
      width: 6px;
      height: 6px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: rgba(39, 103, 79, 0.24);
      cursor: pointer;
    }

    .motion-dot.is-active {
      width: 16px;
      border-radius: 999px;
      background: var(--green);
    }

    .motion-dot:focus-visible {
      outline: 2px solid var(--green);
      outline-offset: 3px;
    }

    .todo-calendar {
      width: 118px;
      height: 96px;
      position: relative;
      border-radius: 16px;
      background: #ffffff;
      border: 1px solid rgba(63, 143, 114, 0.18);
      box-shadow: 0 8px 18px rgba(31, 42, 49, 0.06);
      overflow: hidden;
    }

    .calendar-head {
      height: 28px;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      align-items: center;
      padding: 0 8px;
      background: var(--green-soft);
      color: var(--green-deep);
      font-size: 9px;
      font-weight: 850;
      text-align: center;
    }

    .calendar-body {
      padding: 10px 10px 9px;
      display: grid;
      gap: 8px;
    }

    .todo-line {
      display: grid;
      grid-template-columns: 16px 1fr;
      gap: 7px;
      align-items: center;
    }

    .todo-check {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--green);
      position: relative;
    }

    .todo-check::after {
      content: "";
      position: absolute;
      left: 5px;
      top: 3px;
      width: 5px;
      height: 8px;
      border: solid #ffffff;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    .todo-text {
      min-width: 0;
      height: 8px;
      border-radius: 999px;
      background: var(--line);
    }

    .todo-line:nth-child(1) .todo-text {
      width: 74px;
      background: rgba(63, 143, 114, 0.32);
    }

    .todo-line:nth-child(2) .todo-text {
      width: 58px;
    }

    .todo-line:nth-child(3) .todo-text {
      width: 68px;
      background: rgba(63, 115, 168, 0.22);
    }

    .motion-copy {
      display: grid;
      gap: 8px;
    }

    .motion-copy strong {
      color: var(--green-deep);
      font-size: 17px;
      line-height: 1.35;
    }

    .motion-copy span {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      margin-top: 14px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--line);
    }

    .stat {
      min-height: 70px;
      padding: 10px 8px;
      background: var(--surface);
      text-align: center;
      display: grid;
      align-content: center;
      gap: 2px;
    }

    .stat strong {
      color: var(--ink);
      font-size: 20px;
      line-height: 1.1;
    }

    .stat span {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    main {
      padding: 18px var(--page-x) calc(var(--nav-h) + 26px);
    }

    .section {
      margin-top: 18px;
    }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 10px;
    }

    .section-title {
      font-size: 18px;
      line-height: 1.35;
      font-weight: 850;
    }

    .section-note {
      color: var(--quiet);
      font-size: 12px;
      white-space: nowrap;
      font-weight: 700;
    }

    .points {
      padding: 14px;
      border-radius: var(--radius-md);
      background: var(--green-soft);
      border: 1px solid rgba(63, 143, 114, 0.2);
      color: var(--green-deep);
      font-size: 14px;
      font-weight: 650;
    }

    .group-list {
      display: grid;
      gap: 12px;
    }

    .group {
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: var(--surface);
      box-shadow: 0 5px 16px rgba(31, 42, 49, 0.04);
      overflow: hidden;
    }

    .group-header {
      padding: 14px 14px 12px;
      border-bottom: 1px solid var(--line);
      background: var(--surface-soft);
    }

    .group-kicker {
      color: var(--green-deep);
      font-size: 11px;
      font-weight: 850;
      letter-spacing: 0;
    }

    .group-title {
      margin-top: 4px;
      font-size: 17px;
      line-height: 1.35;
      font-weight: 850;
    }

    .group-summary {
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
    }

    .item-list {
      display: grid;
      gap: 0;
    }

    .item {
      padding: 14px;
      border-top: 1px solid var(--line);
    }

    .item:first-child {
      border-top: 0;
    }

    .item-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .item-title {
      min-width: 0;
      font-size: 15px;
      line-height: 1.45;
      font-weight: 850;
    }

    .tag {
      flex: 0 0 auto;
      min-height: 24px;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 850;
      line-height: 1.55;
      white-space: nowrap;
    }

    .tag-primary {
      color: var(--red);
      background: var(--red-soft);
    }

    .tag-normal {
      color: var(--blue);
      background: var(--blue-soft);
    }

    .tag-extra {
      color: var(--amber);
      background: var(--amber-soft);
    }

    .item-content {
      color: var(--ink);
      font-size: 14px;
      line-height: 1.72;
    }

    .focus {
      margin-top: 10px;
      padding: 10px 11px;
      border-radius: var(--radius-sm);
      background: #fbfaf5;
      border: 1px solid #eee5d2;
      color: #6e5b38;
      font-size: 13px;
      line-height: 1.62;
    }

    .focus strong {
      display: block;
      margin-bottom: 2px;
      color: var(--amber);
      font-size: 12px;
      line-height: 1.4;
    }

    .empty {
      display: none;
      padding: 22px 14px;
      border: 1px dashed var(--line-strong);
      border-radius: var(--radius-md);
      color: var(--muted);
      background: var(--surface);
      text-align: center;
      font-size: 14px;
    }

    .bottom-nav {
      position: fixed;
      z-index: 10;
      left: 50%;
      bottom: 0;
      width: min(100%, 430px);
      min-height: var(--nav-h);
      transform: translateX(-50%);
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
      border-top: 1px solid rgba(209, 222, 215, 0.86);
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(14px);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .nav-btn {
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      color: var(--muted);
      font-size: 12px;
      font-weight: 850;
      cursor: pointer;
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease, color 160ms ease;
    }

    .nav-btn[aria-pressed="true"] {
      border-color: rgba(63, 143, 114, 0.34);
      background: var(--green-soft);
      color: var(--green-deep);
    }

    .nav-btn:focus-visible {
      outline: 3px solid rgba(63, 115, 168, 0.25);
      outline-offset: 2px;
    }

    .nav-btn:active {
      transform: scale(0.97);
    }

    .is-hidden {
      display: none;
    }

    @media (min-width: 720px) {
      body {
        padding: 24px 0;
      }

      .phone {
        min-height: calc(100vh - 48px);
        border-radius: 28px;
        box-shadow: 0 20px 60px rgba(31, 42, 49, 0.16);
      }

      .bottom-nav {
        bottom: 24px;
        border-radius: 0 0 28px 28px;
      }
    }

    @media (max-width: 360px) {
      :root {
        --page-x: 12px;
      }

      .cover-title {
        font-size: 22px;
      }

      .motion-card {
        grid-template-columns: 1fr;
      }

      .motion-illustration {
        width: 100%;
        height: 134px;
      }

      .motion-illustration img {
        width: 116px;
        height: 146px;
      }

      .todo-calendar {
        width: 100%;
      }

      .stat strong {
        font-size: 18px;
      }

      .cover-sheet {
        width: 88%;
        padding-inline: 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      .nav-btn {
        transition: none;
      }

      .motion-illustration img {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <div class="phone">
    <header class="hero" id="top">
      <section class="cover" aria-labelledby="planTitle">
        <div class="cover-stage">
          <div class="cover-sheet">
            <span class="clip" aria-hidden="true"></span>
            <div class="cover-top">
              <span class="plan-badge" id="planBadge"></span>
            </div>
            <h1 class="cover-title" id="planTitle"></h1>
            <div class="cover-patient" id="patientName"></div>
            <p class="cover-summary" id="planSummary"></p>

            <div class="motion-card" aria-label="运动处方摘要">
              <div class="motion-illustration">
                <img id="motionIllustrationImage" src="../../../AI 健管师 IP/08_运动形象_透明底/AI健管师IP_运动形象_01_快走慢跑_透明底.png" alt="AI健管师快走慢跑插图" />
                <div class="motion-dots" id="motionDots" aria-label="切换运动插图"></div>
              </div>
              <div class="motion-copy">
                <strong id="motionTitle"></strong>
                <span id="motionDesc"></span>
              </div>
            </div>
          </div>
        </div>

        <div class="cover-ribbon">
          <div class="stats" aria-label="方案统计">
            <div class="stat">
              <strong id="groupCount">0</strong>
              <span>方案分组</span>
            </div>
            <div class="stat">
              <strong id="itemCount">0</strong>
              <span>执行动作</span>
            </div>
            <div class="stat">
              <strong id="keyCount">0</strong>
              <span>重点执行</span>
            </div>
          </div>
        </div>
      </section>
    </header>

    <main>
      <section class="section" aria-labelledby="pointsTitle">
        <div class="section-head">
          <h2 class="section-title" id="pointsTitle">执行要点</h2>
          <span class="section-note" id="pointsCount"></span>
        </div>
        <p class="points" id="executionPoints"></p>
      </section>

      <section class="section" aria-labelledby="groupsTitle">
        <div class="section-head">
          <h2 class="section-title" id="groupsTitle">行动清单</h2>
          <span class="section-note" id="activeFilterLabel">全部</span>
        </div>
        <div class="group-list" id="groupList"></div>
        <div class="empty" id="emptyState">当前筛选下暂无动作。</div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="重要性筛选">
      <button class="nav-btn" type="button" data-filter="all" aria-pressed="true">全部</button>
      <button class="nav-btn" type="button" data-filter="重点执行" aria-pressed="false">重点</button>
      <button class="nav-btn" type="button" data-filter="常规建议" aria-pressed="false">常规</button>
      <button class="nav-btn" type="button" data-filter="补充建议" aria-pressed="false">补充</button>
    </nav>
  </div>

  <script>
    const finalPlanJsonText = "{\"planName\":\"运动健康处方\",\"planTitle\":\"个体化运动管理：降糖控压、减重护血管\",\"planSummary\":\"本方案针对您2型糖尿病合并高血压、高脂血症、周围血管病变及肥胖的情况，围绕餐后血糖控制、血压平稳、减重及血管保护设计。重点包括餐后短时步行降低餐后高血糖、利用碎片时间进行低至中等强度有氧运动、结合抗阻训练增强肌肉量以改善胰岛素敏感性，以及运动前后血糖监测和足部护理，帮助您逐步建立可持续的运动习惯，改善代谢指标。\",\"executionPoints\":\"优先执行餐后步行（如晚餐后15-20分钟开始步行10-15分钟）和利用零散时间进行短时活动；运动前后务必测量血糖，避免在血糖过高（>13.9mmol/L）或过低（<5.6mmol/L）时运动；运动时穿舒适鞋袜，注意足部感觉，避免高冲击活动；如出现胸闷、头晕、明显乏力、足部疼痛或异常，应立即停止运动并联系医生或健管师；每周记录运动类型、时长、血糖及血压变化，以便调整方案。\",\"groups\":[{\"groupTitle\":\"运动总原则\",\"groupType\":\"adviceList\",\"groupSummary\":\"明确运动目标（控糖、减重、降压）、安全边界和执行节奏。\",\"displayStyle\":\"list\",\"dietPlanGoalLabel\":\"\",\"goalBasis\":\"\",\"items\":[{\"itemType\":\"advice\",\"day\":\"\",\"title\":\"运动目标\",\"content\":\"每周累计至少150分钟中等强度有氧运动，配合2-3次抗阻训练，帮助控制血糖、减轻体重、改善血压。\",\"focusPoint\":\"当前晚餐后血糖极高（19.5mmol/L），运动是辅助降糖的重要手段，但需避开血糖过高（>16.7mmol/L）或过低（<3.9mmol/L）时段。\",\"importance\":\"重点执行\",\"dailyTotalKcal\":\"\",\"dailyTotalProteinG\":\"\",\"dailyTotalFatG\":\"\",\"estimatedEnergyDeficitKcal\":\"\",\"meals\":[]},{\"itemType\":\"advice\",\"day\":\"\",\"title\":\"安全第一\",\"content\":\"运动前测血糖、量血压；运动中若出现胸闷、头晕、明显乏力、足部疼痛，立即停止并联系医生。\",\"focusPoint\":\"血压曾有150/100mmHg，虽随访平稳仍需警惕；合并周围血管病变，注意足部感觉和皮肤状况，避免高冲击活动。\",\"importance\":\"重点执行\",\"dailyTotalKcal\":\"\",\"dailyTotalProteinG\":\"\",\"dailyTotalFatG\":\"\",\"estimatedEnergyDeficitKcal\":\"\",\"meals\":[]},{\"itemType\":\"advice\",\"day\":\"\",\"title\":\"循序渐进\",\"content\":\"从低强度（如慢走）开始，每1-2周适当增加时长或强度，避免突然大量运动。\",\"focusPoint\":\"近一年运动频率低（每周1次），需逐步适应，防止受伤或过度疲劳。\",\"importance\":\"常规建议\",\"dailyTotalKcal\":\"\",\"dailyTotalProteinG\":\"\",\"dailyTotalFatG\":\"\",\"estimatedEnergyDeficitKcal\":\"\",\"meals\":[]}]},{\"groupTitle\":\"有氧运动安排\",\"groupType\":\"adviceList\",\"groupSummary\":\"从低到中等强度有氧运动开始，逐步改善血糖和体重管理。\",\"displayStyle\":\"list\",\"dietPlanGoalLabel\":\"\",\"goalBasis\":\"\",\"items\":[{\"itemType\":\"advice\",\"day\":\"\",\"title\":\"饭后快走\",\"content\":\"每周安排5天，每次餐后1小时快走或慢走15-20分钟，累计每天30分钟以上。\",\"focusPoint\":\"餐后血糖极高（19.5mmol/L），饭后步行可显著降低餐后血糖峰值；注意避开血糖>16.7mmol/L时运动，可先测血糖再决定。\",\"importance\":\"重点执行\",\"dailyTotalKcal\":\"\",\"dailyTotalProteinG\":\"\",\"dailyTotalFatG\":\"\",\"estimatedEnergyDeficitKcal\":\"\",\"meals\":[]},{\"itemType\":\"advice\",\"day\":\"\",\"title\":\"碎片化有氧\",\"content\":\"利用工间休息、等车、接电话等零散时间，每次快走或原地踏步5-10分钟，累计每天总时长。\",\"focusPoint\":\"适合夜班多、整块时间少的现状；每次短时活动也能累积降糖效果。\",\"importance\":\"常规建议\",\"dailyTotalKcal\":\"\",\"dailyTotalProteinG\":\"\",\"dailyTotalFatG\":\"\",\"estimatedEnergyDeficitKcal\":\"\",\"meals\":[]},{\"itemType\":\"advice\",\"day\":\"\",\"title\":\"周末延长活动\",\"content\":\"周末选一天进行连续30-45分钟的步行或慢跑，心率控制在（220-年龄）×60%~70%。\",\"focusPoint\":\"当前步数约3000步，逐渐增加步数至6000-8000步/天；慢跑需注意足部保护，穿合适跑鞋。\",\"importance\":\"补充建议\",\"dailyTotalKcal\":\"\",\"dailyTotalProteinG\":\"\",\"dailyTotalFatG\":\"\",\"estimatedEnergyDeficitKcal\":\"\",\"meals\":[]}]},{\"groupTitle\":\"抗阻训练安排\",\"groupType\":\"adviceList\",\"groupSummary\":\"从低负荷动作开始，每周2-3次，增强肌肉量和胰岛素敏感性。\",\"displayStyle\":\"list\",\"dietPlanGoalLabel\":\"\",\"goalBasis\":\"\",\"items\":[{\"itemType\":\"advice\",\"day\":\"\",\"title\":\"居家抗阻基础动作\",\"content\":\"每周非连续2-3天，完成靠墙静蹲（每次30秒-1分钟）、坐姿抬腿（每侧10-15次）、弹力带划船（10-15次），每个动作2-3组。\",\"focusPoint\":\"动作过程中保持呼吸，避免憋气导致血压骤升；如有弹力带可从低阻力开始。\",\"importance\":\"重点执行\",\"dailyTotalKcal\":\"\",\"dailyTotalProteinG\":\"\",\"dailyTotalFatG\":\"\",\"estimatedEnergyDeficitKcal\":\"\",\"meals\":[]},{\"itemType\":\"advice\",\"day\":\"\",\"title\":\"上肢力量训练\",\"content\":\"使用小哑铃或弹力带做二头弯举、肩部推举，每组10-12次，共2-3组。\",\"focusPoint\":\"可穿插在夜班休息时进行，每次5-10分钟即可完成。\",\"importance\":\"常规建议\",\"dailyTotalKcal\":\"\",\"dailyTotalProteinG\":\"\",\"dailyTotalFatG\":\"\",\"estimatedEnergyDeficitKcal\":\"\",\"meals\":[]}]},{\"groupTitle\":\"柔韧与平衡训练\",\"groupType\":\"adviceList\",\"groupSummary\":\"改善关节灵活性和平衡能力，减少运动损伤风险。\",\"displayStyle\":\"list\",\"dietPlanGoalLabel\":\"\",\"goalBasis\":\"\",\"items\":[{\"itemType\":\"advice\",\"day\":\"\",\"title\":\"动态拉伸热身\",\"content\":\"每次有氧或抗阻训练前，做5分钟动态拉伸（如摆腿、转肩、弓步转体）。\",\"focusPoint\":\"动态拉伸可提升关节活动度，降低拉伤风险；尤其适合久坐后开始运动。\",\"importance\":\"常规建议\",\"dailyTotalKcal\":\"\",\"dailyTotalProteinG\":\"\",\"dailyTotalFatG\":\"\",\"estimatedEnergyDeficitKcal\":\"\",\"meals\":[]},{\"itemType\":\"advice\",\"day\":\"\",\"title\":\"静态拉伸放松\",\"content\":\"运动后或睡前，做5-10分钟静态拉伸（如大腿后侧、小腿、肩部拉伸），每个动作保持20-30秒。\",\"focusPoint\":\"有助于放松肌肉、改善睡眠质量；夜班后做可帮助身体恢复。\",\"importance\":\"常规建议\",\"dailyTotalKcal\":\"\",\"dailyTotalProteinG\":\"\",\"dailyTotalFatG\":\"\",\"estimatedEnergyDeficitKcal\":\"\",\"meals\":[]},{\"itemType\":\"advice\",\"day\":\"\",\"title\":\"单腿站立平衡\",\"content\":\"每天1-2次，每次单腿站立30秒，交替进行，手可扶墙。\",\"focusPoint\":\"改善下肢平衡和本体感觉，预防跌倒；合并周围血管病变时注意足部支撑。\",\"importance\":\"补充建议\",\"dailyTotalKcal\":\"\",\"dailyTotalProteinG\":\"\",\"dailyTotalFatG\":\"\",\"estimatedEnergyDeficitKcal\":\"\",\"meals\":[]}]},{\"groupTitle\":\"夜班/碎片化运动策略\",\"groupType\":\"adviceList\",\"groupSummary\":\"针对夜班作息和碎片化时间，设计灵活可执行的活动方案。\",\"displayStyle\":\"list\",\"dietPlanGoalLabel\":\"\",\"goalBasis\":\"\",\"items\":[{\"itemType\":\"advice\",\"day\":\"\",\"title\":\"夜班小活动\",\"content\":\"夜班每隔2-3小时起身活动5分钟，如原地踏步、伸展、靠墙静蹲。\",\"focusPoint\":\"避免长时间久坐导致血糖升高和下肢循环不良；活动前后可少量饮水。\",\"importance\":\"重点执行\",\"dailyTotalKcal\":\"\",\"dailyTotalProteinG\":\"\",\"dailyTotalFatG\":\"\",\"estimatedEnergyDeficitKcal\":\"\",\"meals\":[]},{\"itemType\":\"advice\",\"day\":\"\",\"title\":\"下班后低强度放松\",\"content\":\"夜班回家后先休息30分钟，再慢走15分钟或做一套拉伸，帮助身体过渡到休息状态。\",\"focusPoint\":\"避免立即高强度运动，防止过度疲劳影响睡眠。\",\"importance\":\"常规建议\",\"dailyTotalKcal\":\"\",\"dailyTotalProteinG\":\"\",\"dailyTotalFatG\":\"\",\"estimatedEnergyDeficitKcal\":\"\",\"meals\":[]},{\"itemType\":\"advice\",\"day\":\"\",\"title\":\"利用通勤碎片时间\",\"content\":\"上下班途中提前一站下车快走，或走楼梯代替电梯。\",\"focusPoint\":\"每次5-10分钟即可累积有效活动量，且不占用整块时间。\",\"importance\":\"补充建议\",\"dailyTotalKcal\":\"\",\"dailyTotalProteinG\":\"\",\"dailyTotalFatG\":\"\",\"estimatedEnergyDeficitKcal\":\"\",\"meals\":[]}]},{\"groupTitle\":\"运动前后监测与安全\",\"groupType\":\"adviceList\",\"groupSummary\":\"确保运动安全，预防低血糖、血压异常及足部损伤。\",\"displayStyle\":\"list\",\"dietPlanGoalLabel\":\"\",\"goalBasis\":\"\",\"items\":[{\"itemType\":\"advice\",\"day\":\"\",\"title\":\"运动前必测\",\"content\":\"运动前测血糖，若<5.6mmol/L先补充15克碳水化合物（如半杯果汁）；若>16.7mmol/L暂缓运动。\",\"focusPoint\":\"服用吡格列酮二甲双胍片，低血糖风险虽低但需警惕；餐后血糖极高时运动可能加重高血糖。\",\"importance\":\"重点执行\",\"dailyTotalKcal\":\"\",\"dailyTotalProteinG\":\"\",\"dailyTotalFatG\":\"\",\"estimatedEnergyDeficitKcal\":\"\",\"meals\":[]},{\"itemType\":\"advice\",\"day\":\"\",\"title\":\"运动后检查\",\"content\":\"运动后测血糖、检查双足有无红肿、破损或水泡。\",\"focusPoint\":\"周围血管病变可能使足部感觉迟钝，每日自查足部皮肤非常重要。\",\"importance\":\"重点执行\",\"dailyTotalKcal\":\"\",\"dailyTotalProteinG\":\"\",\"dailyTotalFatG\":\"\",\"estimatedEnergyDeficitKcal\":\"\",\"meals\":[]},{\"itemType\":\"advice\",\"day\":\"\",\"title\":\"血压监测\",\"content\":\"运动前后若感到头晕、头痛，及时测量血压；血压>180/110mmHg时暂停运动。\",\"focusPoint\":\"起床血压150/100mmHg提示血压控制仍需优化，运动强度不宜过高。\",\"importance\":\"常规建议\",\"dailyTotalKcal\":\"\",\"dailyTotalProteinG\":\"\",\"dailyTotalFatG\":\"\",\"estimatedEnergyDeficitKcal\":\"\",\"meals\":[]}]}]}";
    const planData = JSON.parse(finalPlanJsonText);
    const externalPatientInfo = {
      patientName: "张三"
    };

    const importanceClass = {
      "重点执行": "tag-primary",
      "常规建议": "tag-normal",
      "补充建议": "tag-extra"
    };

    const filterLabels = {
      all: "全部",
      "重点执行": "重点执行",
      "常规建议": "常规建议",
      "补充建议": "补充建议"
    };

    const motionIllustrations = [
      {
        src: "../../../AI 健管师 IP/08_运动形象_透明底/AI健管师IP_运动形象_01_快走慢跑_透明底.png",
        alt: "AI健管师快走慢跑插图"
      },
      {
        src: "../../../AI 健管师 IP/08_运动形象_透明底/AI健管师IP_运动形象_02_伸展拉伸_透明底.png",
        alt: "AI健管师伸展拉伸插图"
      },
      {
        src: "../../../AI 健管师 IP/08_运动形象_透明底/AI健管师IP_运动形象_03_动感单车_透明底.png",
        alt: "AI健管师动感单车插图"
      },
      {
        src: "../../../AI 健管师 IP/08_运动形象_透明底/AI健管师IP_运动形象_04_轻力量训练_透明底.png",
        alt: "AI健管师轻力量训练插图"
      }
    ];

    const state = {
      filter: "all",
      illustrationIndex: 0,
      carouselTimer: null
    };

    function text(value, fallback = "") {
      return value == null || String(value).trim() === "" ? fallback : String(value).trim();
    }

    function countItems(groups) {
      return groups.reduce((total, group) => total + (Array.isArray(group.items) ? group.items.length : 0), 0);
    }

    function countImportant(groups) {
      return groups.reduce((total, group) => {
        const items = Array.isArray(group.items) ? group.items : [];
        return total + items.filter((item) => item.importance === "重点执行").length;
      }, 0);
    }

    function flattenItems(groups) {
      return groups.flatMap((group) => Array.isArray(group.items) ? group.items : []);
    }

    function findFeatureItem(groups) {
      const items = flattenItems(groups);
      return items.find((item) => item.importance === "重点执行") || items[0] || {};
    }

    function createItem(item) {
      const article = document.createElement("article");
      article.className = "item";
      article.dataset.importance = text(item.importance);

      const top = document.createElement("div");
      top.className = "item-top";

      const title = document.createElement("h3");
      title.className = "item-title";
      title.textContent = text(item.title);

      const tag = document.createElement("span");
      tag.className = `tag ${importanceClass[item.importance] || "tag-normal"}`;
      tag.textContent = text(item.importance);

      top.append(title, tag);

      const content = document.createElement("p");
      content.className = "item-content";
      content.textContent = text(item.content);

      const focus = document.createElement("p");
      focus.className = "focus";
      const focusLabel = document.createElement("strong");
      focusLabel.textContent = "关注点";
      const focusText = document.createTextNode(text(item.focusPoint));
      focus.append(focusLabel, focusText);

      article.append(top, content, focus);
      return article;
    }

    function createGroup(group, index) {
      const section = document.createElement("section");
      section.className = "group";

      const header = document.createElement("div");
      header.className = "group-header";

      const kicker = document.createElement("div");
      kicker.className = "group-kicker";
      kicker.textContent = `主题 ${index + 1}`;

      const title = document.createElement("h2");
      title.className = "group-title";
      title.textContent = text(group.groupTitle);

      header.append(kicker, title);

      if (text(group.groupSummary)) {
        const summary = document.createElement("p");
        summary.className = "group-summary";
        summary.textContent = text(group.groupSummary);
        header.append(summary);
      }

      const list = document.createElement("div");
      list.className = "item-list";
      const items = Array.isArray(group.items) ? group.items : [];
      items.forEach((item) => list.append(createItem(item)));

      section.append(header, list);
      return section;
    }

    function renderPlan(plan) {
      const groups = Array.isArray(plan.groups) ? plan.groups : [];
      const featureItem = findFeatureItem(groups);

      document.getElementById("planBadge").textContent = text(plan.planName);
      document.getElementById("planTitle").textContent = text(plan.planTitle);
      document.getElementById("patientName").textContent = `${externalPatientInfo.patientName}专属方案`;
      document.getElementById("planSummary").textContent = text(plan.planSummary);
      document.getElementById("executionPoints").textContent = text(plan.executionPoints);
      document.getElementById("motionTitle").textContent = text(featureItem.title);
      document.getElementById("motionDesc").textContent = text(featureItem.content);
      document.getElementById("pointsCount").textContent = "";
      document.getElementById("groupCount").textContent = groups.length;
      document.getElementById("itemCount").textContent = countItems(groups);
      document.getElementById("keyCount").textContent = countImportant(groups);

      const groupList = document.getElementById("groupList");
      groupList.textContent = "";
      groups.forEach((group, index) => groupList.append(createGroup(group, index)));
      applyFilter(state.filter);
    }

    function applyFilter(filter) {
      state.filter = filter;
      document.getElementById("activeFilterLabel").textContent = filterLabels[filter] || "全部";

      const buttons = document.querySelectorAll(".nav-btn");
      buttons.forEach((button) => {
        button.setAttribute("aria-pressed", String(button.dataset.filter === filter));
      });

      let visibleItems = 0;
      document.querySelectorAll(".item").forEach((item) => {
        const show = filter === "all" || item.dataset.importance === filter;
        item.classList.toggle("is-hidden", !show);
        if (show) visibleItems += 1;
      });

      document.querySelectorAll(".group").forEach((group) => {
        const hasVisibleItem = Boolean(group.querySelector(".item:not(.is-hidden)"));
        group.classList.toggle("is-hidden", !hasVisibleItem);
      });

      document.getElementById("emptyState").style.display = visibleItems === 0 ? "block" : "none";
    }

    function renderMotionDots() {
      const dots = document.getElementById("motionDots");
      dots.innerHTML = motionIllustrations.map((item, index) => `
        <button
          class="motion-dot ${index === state.illustrationIndex ? "is-active" : ""}"
          type="button"
          aria-label="查看${item.alt.replace("AI健管师", "")}"
          aria-pressed="${index === state.illustrationIndex}"
          data-index="${index}">
        </button>
      `).join("");

      dots.querySelectorAll(".motion-dot").forEach((dot) => {
        dot.addEventListener("click", () => {
          setMotionIllustration(Number(dot.dataset.index));
          restartMotionCarousel();
        });
      });
    }

    function setMotionIllustration(index) {
      const nextIndex = (index + motionIllustrations.length) % motionIllustrations.length;
      const next = motionIllustrations[nextIndex];
      const image = document.getElementById("motionIllustrationImage");
      state.illustrationIndex = nextIndex;

      image.classList.add("is-switching");
      window.setTimeout(() => {
        image.src = next.src;
        image.alt = next.alt;
        image.classList.remove("is-switching");
        renderMotionDots();
      }, 180);
    }

    function startMotionCarousel() {
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        renderMotionDots();
        return;
      }

      state.carouselTimer = window.setInterval(() => {
        setMotionIllustration(state.illustrationIndex + 1);
      }, 3200);
    }

    function restartMotionCarousel() {
      window.clearInterval(state.carouselTimer);
      startMotionCarousel();
    }

    document.querySelectorAll(".nav-btn").forEach((button) => {
      button.addEventListener("click", () => applyFilter(button.dataset.filter));
    });

    renderPlan(planData);
    renderMotionDots();
    startMotionCarousel();
  </script>
</body>
</html>
