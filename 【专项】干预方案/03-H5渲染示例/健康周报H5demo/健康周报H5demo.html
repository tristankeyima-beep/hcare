<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>健康周报H5demo</title>
  <style>
    :root {
      --bg: #eef3f4;
      --surface: #fbfdfc;
      --surface-soft: #f5f8f7;
      --ink: #162326;
      --muted: #647477;
      --quiet: #8a999c;
      --line: #dfe8e6;
      --accent: #287c68;
      --accent-deep: #145a4a;
      --accent-soft: #e4f3ee;
      --blue: #326c9d;
      --blue-soft: #e8f2fb;
      --amber: #94631f;
      --amber-soft: #fff2da;
      --green: #327b4b;
      --green-soft: #e8f7ed;
      --slate: #465b67;
      --slate-soft: #edf2f5;
      --red: #a9444f;
      --red-soft: #fff0f2;
      --violet: #6740a6;
      --violet-soft: #f3edff;
      --shadow: 0 18px 42px rgba(29, 45, 49, 0.14);
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --ease: cubic-bezier(0.2, 0.9, 0.2, 1);
      --page-x: 16px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: #dde8e7;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(180deg, #e2efec 0, rgba(238, 243, 244, 0) 330px),
        var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: 15px;
      line-height: 1.58;
      overflow: hidden;
    }

    button {
      font: inherit;
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    .app {
      width: min(100%, 430px);
      height: 100vh;
      min-height: 620px;
      margin: 0 auto;
      background: var(--bg);
      display: grid;
      grid-template-rows: auto 1fr auto;
      position: relative;
      overflow: hidden;
    }

    .topbar {
      min-width: 0;
      padding: calc(env(safe-area-inset-top, 0px) + 12px) var(--page-x) 12px;
      background: rgba(238, 243, 244, 0.88);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(223, 232, 230, 0.78);
      position: relative;
      z-index: 2;
    }

    .topline {
      min-height: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .report-owner {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--accent-deep);
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .patient-dot {
      width: 8px;
      height: 8px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 5px rgba(40, 124, 104, 0.12);
    }

    .generated-time {
      margin-top: 4px;
      color: var(--quiet);
      font-size: 12px;
      font-weight: 700;
    }

    .progress-text {
      color: var(--quiet);
      flex: 0 0 auto;
    }

    .swipe-hint {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--quiet);
      font-size: 12px;
      font-weight: 700;
    }

    .swipe-mark {
      width: 32px;
      height: 18px;
      flex: 0 0 auto;
      border-radius: 999px;
      border: 1px solid rgba(20, 90, 74, 0.18);
      background: rgba(251, 253, 252, 0.72);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-deep);
      font-size: 14px;
      line-height: 1;
      animation: swipeNudge 1800ms var(--ease) infinite;
      will-change: transform;
    }

    @keyframes swipeNudge {
      0%,
      100% {
        transform: translateX(0);
      }
      22% {
        transform: translateX(-4px);
      }
      44% {
        transform: translateX(4px);
      }
      62% {
        transform: translateX(0);
      }
    }

    .stage {
      min-width: 0;
      min-height: 0;
      position: relative;
      padding: 14px 0 10px;
      overflow: hidden;
    }

    .slides {
      min-width: 0;
      width: 100%;
      height: 100%;
      display: block;
      overflow: hidden;
      overflow-y: hidden;
      padding: 0 var(--page-x) 8px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      touch-action: pan-y;
      user-select: none;
    }

    .slides::-webkit-scrollbar {
      display: none;
    }

    .card {
      display: none;
      width: calc(100vw - 64px);
      max-width: 366px;
      min-width: 280px;
      height: 100%;
      margin: 0 auto;
      border-radius: var(--radius-lg);
      border: 1px solid rgba(22, 35, 38, 0.08);
      background: var(--surface);
      box-shadow: var(--shadow);
      padding: 22px 18px 18px;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      isolation: isolate;
    }

    .card.is-active {
      display: flex;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 144px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.32), rgba(255, 255, 255, 0));
      pointer-events: none;
      z-index: -1;
    }

    .card-cover {
      background: linear-gradient(160deg, #e0f1eb 0%, #fbfdfc 68%);
    }

    .tone-blue {
      background: linear-gradient(160deg, var(--blue-soft) 0%, #fbfdfc 74%);
    }

    .tone-amber {
      background: linear-gradient(160deg, var(--amber-soft) 0%, #fbfdfc 74%);
    }

    .tone-green {
      background: linear-gradient(160deg, var(--green-soft) 0%, #fbfdfc 74%);
    }

    .tone-slate {
      background: linear-gradient(160deg, var(--slate-soft) 0%, #fbfdfc 74%);
    }

    .tone-red {
      background: linear-gradient(160deg, var(--red-soft) 0%, #fbfdfc 74%);
    }

    .tone-violet {
      background: linear-gradient(160deg, var(--violet-soft) 0%, #fbfdfc 74%);
    }

    .kicker {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .badge {
      min-height: 26px;
      padding: 4px 9px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.72);
      color: var(--accent-deep);
      border: 1px solid rgba(20, 90, 74, 0.12);
      white-space: nowrap;
    }

    .card-title {
      margin-top: 18px;
      color: var(--ink);
      font-size: 28px;
      line-height: 1.14;
      font-weight: 900;
      letter-spacing: 0;
    }

    .group-name {
      margin-top: 12px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 800;
    }

    .copy {
      margin-top: 16px;
      color: #334347;
      font-size: 15px;
      line-height: 1.68;
    }

    .detail-block {
      margin-top: 18px;
      padding: 14px;
      border-radius: var(--radius-md);
      background: rgba(251, 253, 252, 0.74);
      border: 1px solid rgba(22, 35, 38, 0.08);
    }

    .detail-label {
      display: block;
      margin-bottom: 7px;
      color: var(--ink);
      font-size: 13px;
      font-weight: 850;
    }

    .detail-text {
      color: #46585c;
      font-size: 13px;
      line-height: 1.6;
    }

    .basis {
      margin-top: 12px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .summary-footer {
      margin-top: auto;
      padding-top: 18px;
      display: grid;
      gap: 10px;
    }

    .meta-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .meta {
      min-height: 74px;
      padding: 10px 8px;
      border-radius: var(--radius-md);
      background: rgba(251, 253, 252, 0.72);
      border: 1px solid rgba(22, 35, 38, 0.08);
    }

    .meta strong {
      display: block;
      color: var(--ink);
      font-size: 22px;
      line-height: 1;
      font-weight: 900;
    }

    .meta span {
      display: block;
      margin-top: 7px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.28;
      font-weight: 700;
    }

    .hint {
      color: var(--quiet);
      font-size: 12px;
      font-weight: 700;
    }

    .controls {
      min-width: 0;
      padding: 10px var(--page-x) calc(env(safe-area-inset-bottom, 0px) + 12px);
      background: rgba(238, 243, 244, 0.92);
      border-top: 1px solid rgba(223, 232, 230, 0.86);
      backdrop-filter: blur(14px);
      display: grid;
      gap: 10px;
      position: relative;
      z-index: 2;
    }

    .dots {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 12px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border: 0;
      padding: 0;
      border-radius: 999px;
      background: #b9c7c7;
      transition: width 180ms var(--ease), background-color 180ms var(--ease);
    }

    .dot[aria-current="true"] {
      width: 24px;
      background: var(--accent-deep);
    }

    .actions {
      display: grid;
      grid-template-columns: 48px 1fr 48px;
      gap: 10px;
    }

    .nav-button,
    .primary-button {
      min-height: 46px;
      border: 0;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 160ms var(--ease), background-color 160ms var(--ease);
    }

    .nav-button {
      background: var(--surface);
      color: var(--accent-deep);
      border: 1px solid var(--line);
      font-size: 18px;
      font-weight: 900;
    }

    .primary-button {
      background: var(--accent-deep);
      color: #f7fbfa;
      font-size: 14px;
      font-weight: 850;
    }

    .nav-button:active,
    .primary-button:active {
      transform: scale(0.98);
    }

    .nav-button:focus-visible,
    .primary-button:focus-visible,
    .dot:focus-visible {
      outline: 3px solid rgba(40, 124, 104, 0.28);
      outline-offset: 3px;
    }

    .error {
      display: none;
      margin: 14px var(--page-x);
      padding: 12px 14px;
      border-radius: var(--radius-md);
      background: var(--red-soft);
      color: var(--red);
      border: 1px solid rgba(169, 68, 79, 0.18);
      font-size: 13px;
      font-weight: 700;
    }

    @media (max-width: 360px) {
      .card {
        width: calc(100vw - 48px);
        min-width: 272px;
        padding: 20px 16px 16px;
      }

      .card-title {
        font-size: 25px;
      }

      .copy {
        font-size: 14px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.001ms !important;
      }

      .swipe-mark {
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="app">

    const DEFAULT_PAGE_META = {
      patientName: "患者姓名",
      reportGeneratedAt: "2026-06-12 16:30:00"
    };

    const toneClasses = ["tone-blue", "tone-amber", "tone-green", "tone-slate", "tone-red"];
    const state = {
      activeIndex: 0,
      total: 0
    };

    function safeText(value, fallback = "") {
      if (value == null) return fallback;
      const text = String(value).trim();
      return text === "" ? fallback : text;
    }

    function createElement(tag, className, text) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      if (text != null) element.textContent = text;
      return element;
    }

    function createSwipeHint(text = "左右滑动，看完这周的每个健康主题") {
      const hint = createElement("p", "hint swipe-hint");
      hint.setAttribute("aria-label", "可左右滑动查看");
      hint.append(createElement("span", "swipe-mark", "‹›"));
      hint.append(createElement("span", "", text));
      return hint;
    }

    function formatGeneratedAt(value) {
      const text = safeText(value);
      if (!text) return "生成时间待传入";
      return `${text.replace(/-/g, ".").slice(0, 16)} 生成`;
    }

    function pageMetaFromUrl() {
      const params = new URLSearchParams(location.search);
      const meta = {
        patientName: params.get("patientName") || params.get("name") || "",
        reportGeneratedAt: params.get("reportGeneratedAt") || params.get("generatedAt") || ""
      };
      return Object.fromEntries(Object.entries(meta).filter(([, value]) => safeText(value)));
    }

    function renderPageMeta(meta) {
      const merged = {
        ...DEFAULT_PAGE_META,
        ...meta,
        ...pageMetaFromUrl()
      };
      const patientName = safeText(merged.patientName, DEFAULT_PAGE_META.patientName);
      document.getElementById("reportOwner").textContent = `${patientName}专属健康周报`;
      document.getElementById("generatedTime").textContent = formatGeneratedAt(merged.reportGeneratedAt);
    }

    function primaryItem(group) {
      const items = Array.isArray(group.items) ? group.items : [];
      return items[0] || {};
    }

    function countItems(groups) {
      return groups.reduce((total, group) => {
        return total + (Array.isArray(group.items) ? group.items.length : 0);
      }, 0);
    }

    function appendDetail(card, label, value, className = "detail-block") {
      const text = safeText(value);
      if (!text) return;
      const block = createElement("div", className);
      block.append(createElement("span", "detail-label", label));
      block.append(createElement("p", "detail-text", text));
      card.append(block);
    }

    function createCover(plan, groups) {
      const card = createElement("article", "card card-cover");
      const kicker = createElement("div", "kicker");
      kicker.append(createElement("span", "", "01 / 周报总览"));
      kicker.append(createElement("span", "badge", safeText(plan.planName, "健康周报")));
      card.append(kicker);
      card.append(createElement("h2", "card-title", safeText(plan.planTitle, "这周的健康情况，我们一起看一看")));
      card.append(createElement("p", "copy", safeText(plan.planSummary)));

      const footer = createElement("div", "summary-footer");
      const metaGrid = createElement("div", "meta-grid");
      const stats = [
        [groups.length, "健康主题"],
        [countItems(groups), "周报条目"],
        [groups.filter((group) => primaryItem(group).importance === "重点执行").length, "本周重点"]
      ];
      stats.forEach(([value, label]) => {
        const meta = createElement("div", "meta");
        meta.append(createElement("strong", "", value));
        meta.append(createElement("span", "", label));
        metaGrid.append(meta);
      });
      footer.append(metaGrid);
      footer.append(createSwipeHint());
      card.append(footer);
      return card;
    }

    function createGroupCard(group, index) {
      const item = primaryItem(group);
      const card = createElement("article", `card ${toneClasses[index % toneClasses.length]}`);
      const kicker = createElement("div", "kicker");
      kicker.append(createElement("span", "", `${String(index + 2).padStart(2, "0")} / ${safeText(group.groupTitle, "健康主题")}`));
      kicker.append(createElement("span", "badge", safeText(item.importance, "周报内容")));
      card.append(kicker);
      card.append(createElement("h2", "card-title", safeText(item.title, safeText(group.groupTitle))));
      if (safeText(group.groupSummary)) {
        card.append(createElement("p", "group-name", safeText(group.groupSummary)));
      }
      card.append(createElement("p", "copy", safeText(item.content)));
      appendDetail(card, "这周记录显示", group.goalBasis);
      appendDetail(card, "你可以这样理解", item.focusPoint);
      return card;
    }

    function createExecutionCard(plan, index) {
      const card = createElement("article", "card tone-violet");
      const kicker = createElement("div", "kicker");
      kicker.append(createElement("span", "", `${String(index).padStart(2, "0")} / 下周关注`));
      kicker.append(createElement("span", "badge", "执行要点"));
      card.append(kicker);
      card.append(createElement("h2", "card-title", "下周先稳住这几件事"));
      card.append(createElement("p", "copy", safeText(plan.executionPoints)));
      const footer = createElement("div", "summary-footer");
      footer.append(createElement("p", "hint", "如果出现明显不舒服，优先联系医生或健管师。"));
      card.append(footer);
      return card;
    }

    function updateProgress(index) {
      state.activeIndex = Math.max(0, Math.min(index, state.total - 1));
      document.getElementById("progressText").textContent = `${state.activeIndex + 1} / ${state.total}`;
      document.querySelectorAll(".dot").forEach((dot, dotIndex) => {
        dot.setAttribute("aria-current", String(dotIndex === state.activeIndex));
      });
      document.querySelectorAll(".card").forEach((card, cardIndex) => {
        card.classList.toggle("is-active", cardIndex === state.activeIndex);
      });
      const nextButton = document.getElementById("nextButton");
      nextButton.textContent = state.activeIndex === state.total - 1 ? "回到开头" : "下一张";
    }

    function scrollToSlide(index) {
      updateProgress(index);
    }

    function renderDots(total) {
      const dots = document.getElementById("dots");
      dots.textContent = "";
      for (let index = 0; index < total; index += 1) {
        const dot = createElement("button", "dot");
        dot.type = "button";
        dot.setAttribute("aria-label", `第${index + 1}张`);
        dot.addEventListener("click", () => scrollToSlide(index));
        dots.append(dot);
      }
    }

    function bindSwipeProgress() {
      const slides = document.getElementById("slides");
      let startX = 0;
      let deltaX = 0;
      let dragging = false;

      slides.addEventListener("pointerdown", (event) => {
        dragging = true;
        startX = event.clientX;
        deltaX = 0;
        slides.setPointerCapture(event.pointerId);
      });

      slides.addEventListener("pointermove", (event) => {
        if (!dragging) return;
        deltaX = event.clientX - startX;
      });

      function endDrag(event) {
        if (!dragging) return;
        dragging = false;
        const threshold = 48;
        let nextIndex = state.activeIndex;
        if (deltaX < -threshold) nextIndex += 1;
        if (deltaX > threshold) nextIndex -= 1;
        scrollToSlide(nextIndex);
        if (event && event.pointerId != null) {
          try {
            slides.releasePointerCapture(event.pointerId);
          } catch (error) {
            // Pointer capture may already be released by the browser.
          }
        }
      }

      slides.addEventListener("pointerup", endDrag);
      slides.addEventListener("pointercancel", endDrag);
    }

    function renderPlan(plan) {
      const groups = Array.isArray(plan.groups) ? plan.groups : [];
      const slides = document.getElementById("slides");
      slides.textContent = "";

      slides.append(createCover(plan, groups));
      groups.forEach((group, index) => slides.append(createGroupCard(group, index)));
      slides.append(createExecutionCard(plan, groups.length + 2));

      state.total = slides.children.length;
      renderDots(state.total);
      updateProgress(0);
      bindSwipeProgress();
    }

    async function loadPlan() {
      try {
        const response = await fetch("./dify-final-plan.json", { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return await response.json();
      } catch (error) {
        if (location.protocol !== "file:") {
          const message = document.getElementById("errorMessage");
          message.style.display = "block";
          message.textContent = "未能读取 dify-final-plan.json，当前使用页面内置示例数据。";
        }
        return FALLBACK_PLAN;
      }
    }

    async function loadPageMeta() {
      try {
        const response = await fetch("./page-meta.json", { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return await response.json();
      } catch (error) {
        return DEFAULT_PAGE_META;
      }
    }

    function previousSlide() {
      const nextIndex = state.activeIndex === 0 ? state.total - 1 : state.activeIndex - 1;
      scrollToSlide(nextIndex);
    }

    function nextSlide() {
      const nextIndex = state.activeIndex === state.total - 1 ? 0 : state.activeIndex + 1;
      scrollToSlide(nextIndex);
    }

    document.querySelector(".actions").addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;
      if (button.id === "prevButton") previousSlide();
      if (button.id === "nextButton" || button.id === "nextIconButton") nextSlide();
    });

    Promise.all([loadPlan(), loadPageMeta()]).then(([plan, meta]) => {
      renderPageMeta(meta);
      renderPlan(plan);
    });
  </script>
</body>
</html>
